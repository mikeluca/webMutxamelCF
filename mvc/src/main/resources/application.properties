spring.application.name=WebMtx

# Logs (nivel detallado solo en application-local.properties)
logging.level.org.springframework.security=INFO
logging.level.com.mikedev=INFO

# Templates Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Driver Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Puerto
server.port=${SERVER_PORT:8080}

# N-06: JacksonConfig se elimino porque, al reactivar la autoconfiguracion
# MVC de Boot (BE-05), su ObjectMapper (un "new ObjectMapper()" a mano) se
# convirtio en el que usan los conversores, y NO desactivaba
# FAIL_ON_UNKNOWN_PROPERTIES (Boot si lo desactiva en el suyo): cualquier
# campo JSON desconocido pasaba a dar 400. Con estas propiedades, Boot
# construye su propio ObjectMapper (fechas ISO en vez de epoch,
# FAIL_ON_UNKNOWN_PROPERTIES desactivado por defecto) sin necesidad de un
# bean manual.
spring.jackson.serialization.write-dates-as-timestamps=false