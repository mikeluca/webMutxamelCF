spring.application.name=WebMtx

# Logs (nivel detallado solo en application-local.properties)
logging.level.org.springframework.security=INFO
logging.level.com.mikedev=INFO

# Templates Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Driver Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Puerto
server.port=${SERVER_PORT:8080}

# N-06: JacksonConfig se elimino porque, al reactivar la autoconfiguracion
# MVC de Boot (BE-05), su ObjectMapper (un "new ObjectMapper()" a mano) se
# convirtio en el que usan los conversores, y NO desactivaba
# FAIL_ON_UNKNOWN_PROPERTIES (Boot si lo desactiva en el suyo): cualquier
# campo JSON desconocido pasaba a dar 400. Con estas propiedades, Boot
# construye su propio ObjectMapper (fechas ISO en vez de epoch,
# FAIL_ON_UNKNOWN_PROPERTIES desactivado por defecto) sin necesidad de un
# bean manual.
spring.jackson.serialization.write-dates-as-timestamps=false

# Código de club del Mutxamel C.F. en la FFCV (importador de clasificaciones).
# Nunca se filtra por el texto "Mutxamel": Monnegre (6574) y Benifutsal (6606)
# también lo contienen.
ffcv.club.codigo=3010

# Posible sancion por amarillas acumuladas: cada cuántas amarillas, y a cuántas de ella se avisa
sancion.amarillas.ciclo=5
sancion.amarillas.aviso-previo=1

seguimiento.faltas.umbral=3
seguimiento.mal-comportamiento.umbral=2
seguimiento.dias=30

# Version minima obligatoria de la app movil (GET /api/public/app/version): por debajo de la
# minima la app se bloquea y manda a la tienda; por debajo de la recomendada solo avisa.
app.version.minima.android=1.0.2
app.version.minima.ios=1.0.2
app.version.recomendada.android=1.0.2
app.version.recomendada.ios=1.0.2
app.url.android=https://play.google.com/store/apps/details?id=com.mutxamelcf.app
app.url.ios=${APP_URL_IOS:https://apps.apple.com/es/search?term=Mutxamel%20CF}
