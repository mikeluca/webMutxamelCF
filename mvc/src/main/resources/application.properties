spring.application.name=WebMtx

# Logs (nivel detallado solo en application-local.properties)
logging.level.org.springframework.security=INFO
logging.level.com.mikedev=INFO

# Templates Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Driver Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Subida de archivos
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Puerto
server.port=${SERVER_PORT:8080}

# N-06: JacksonConfig se elimino porque, al reactivar la autoconfiguracion
# MVC de Boot (BE-05), su ObjectMapper (un "new ObjectMapper()" a mano) se
# convirtio en el que usan los conversores, y NO desactivaba
# FAIL_ON_UNKNOWN_PROPERTIES (Boot si lo desactiva en el suyo): cualquier
# campo JSON desconocido pasaba a dar 400. Con estas propiedades, Boot
# construye su propio ObjectMapper (fechas ISO en vez de epoch,
# FAIL_ON_UNKNOWN_PROPERTIES desactivado por defecto) sin necesidad de un
# bean manual.
spring.jackson.serialization.write-dates-as-timestamps=false

# Código de club del Mutxamel C.F. en la FFCV (importador de clasificaciones).
# Nunca se filtra por el texto "Mutxamel": Monnegre (6574) y Benifutsal (6606)
# también lo contienen.
ffcv.club.codigo=3010

# Posible sancion por amarillas acumuladas: cada cuántas amarillas, y a cuántas de ella se avisa
sancion.amarillas.ciclo=5
sancion.amarillas.aviso-previo=1

seguimiento.faltas.umbral=3
seguimiento.mal-comportamiento.umbral=2
seguimiento.dias=30

# Version minima obligatoria de la app movil (GET /api/public/app/version): por debajo de la
# minima la app se bloquea y manda a la tienda; por debajo de la recomendada solo avisa.
# 1.0.15 publicada en Google Play (produccion) y en la App Store el 24/11/2026: por eso la recomendada
# sube a 1.0.15 y la minima a 1.0.14. Una version solo se sube cuando ya se puede descargar en su tienda.
app.version.minima.android=1.0.14
app.version.minima.ios=1.0.14
app.version.recomendada.android=1.0.15
app.version.recomendada.ios=1.0.15
app.url.android=https://play.google.com/store/apps/details?id=com.mutxamelcf.app
app.url.ios=${APP_URL_IOS:https://apps.apple.com/es/app/mutxamel-cf/id6820570960}

# Retransmision: duracion de cada parte segun la modalidad del equipo (minuto del gol)
retransmision.minutos-parte.F11=45
retransmision.minutos-parte.F8=25
retransmision.minutos-parte.F5=20

# Cerrar temporada: por defecto solo desde el día en que empieza la temporada destino. En DEV (application-local)
# se permite antes para poder ensayar el cierre.
app.cierre-temporada.permitir-antes-de-inicio=false

# Imagenes para redes sociales: nombres de equipos (separados por comas, tal como se llaman en EQUIPO) que NO
# salen en las imagenes. Por defecto el Primer Equipo no sale; dejar vacio para que salgan todos.
imagenes-redes.equipos-excluidos=Primer Equipo
