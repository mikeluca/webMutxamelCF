# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT App móvil
app.jwt.secret=${JWT_SECRET}
# 7 dias
app.jwt.expiration-ms=604800000

# SEC-09: la cookie de sesion del panel web solo debe viajar por HTTPS y
# nunca en peticiones cross-site.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# N-03 (auditoria #3): sin esto, Tomcat construye las redirecciones del
# login (exito/error) como URL ABSOLUTA usando el esquema de la conexion
# real que le llega (http, detras de un proxy que no reenvia HTTPS a
# Tomcat), aunque el navegador este en https. Al seguir esa redireccion
# http:// con la cookie de sesion marcada Secure, el navegador NO la
# reenvia -> la peticion siguiente llega sin sesion -> "Invalid CSRF
# token" -> 403 en el login web. use-relative-redirects hace que Tomcat
# emita Location relativas (sin esquema/host), que el navegador sigue
# siempre sobre la conexion real (https): arregla la redireccion sin
# necesidad de confiar en ninguna cabecera X-Forwarded-* del cliente.
server.tomcat.use-relative-redirects=true

# SEC-09: server.forward-headers-strategy=native queda pendiente de
# activar aqui -- solo es seguro si delante hay un proxy inverso de
# confianza que fije X-Forwarded-For/X-Forwarded-Proto (y los reescriba,
# no los reenvie tal cual del cliente). Sin eso, activarlo permitiria a
# cualquier cliente falsificar su IP y saltarse el rate limiting de
# LoginRateLimiter/PublicFormRateLimiter, y falsificar el esquema para
# saltarse la cookie Secure/HSTS. Esta decision es independiente de
# use-relative-redirects: activarlo requiere que nginx SOBRESCRIBA (no
# solo anada) X-Forwarded-For/X-Forwarded-Proto y que el puerto de la
# app no sea accesible directamente desde fuera del servidor.

# INF-08/BE-06: nunca devolver el mensaje de la excepcion ni el stack
# trace al cliente en las paginas de error por defecto de Spring Boot
# (el JSON de las APIs ya lo controla GlobalExceptionHandler aparte).
server.error.include-message=never
server.error.include-stacktrace=never

# INF-08: solo el healthcheck queda expuesto, y sin detalle del estado de
# cada componente (BD, disco...) para quien no esta autenticado.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Firebase (notificaciones push)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}