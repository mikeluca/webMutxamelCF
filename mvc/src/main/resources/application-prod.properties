# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT App móvil
app.jwt.secret=${JWT_SECRET}
# 7 dias
app.jwt.expiration-ms=604800000

# SEC-09: la cookie de sesion del panel web solo debe viajar por HTTPS y
# nunca en peticiones cross-site.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# SEC-09: server.forward-headers-strategy=native queda pendiente de
# activar aqui -- solo es seguro si delante hay un proxy inverso de
# confianza que fije X-Forwarded-For/X-Forwarded-Proto (y los reescriba,
# no los reenvie tal cual del cliente). Sin eso, activarlo permitiria a
# cualquier cliente falsificar su IP y saltarse el rate limiting de
# LoginRateLimiter/PublicFormRateLimiter, y falsificar el esquema para
# saltarse la cookie Secure/HSTS.

# Firebase (notificaciones push)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}