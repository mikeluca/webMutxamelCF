# --- Historia (historia.html) ---
# NOTA: el contenido de esta pagina ya estaba redactado originalmente en
# valenciano (autentico, no traduccion mecanica). Se traslada tal cual a
# esta clave y se redacta una traduccion nueva al castellano para
# messages.properties, en vez de duplicar/alterar el texto valenciano ya
# existente y bien escrito.
historia.titulo=Futbol i futbolistes a Mutxamel
historia.contenido=<p class="lead"><br>\
A Mutxamel, com en moltes altres poblacions, el futbol va esdevenir una activitat social molt popular, especialment entre els hòmens, que disposaven de més llibertat per practicar activitats lúdiques. Fins a les últimes dècades del segle XX, els jocs al carrer i els esports eren pràcticament exclusius dels hòmens, mentre les dones tenien un paper molt més restringit.<br><br>\
Amb l'arribada del futbol a Espanya a principis del segle XX, aquesta modalitat esportiva va començar a arrelar al poble. Ja als anys trenta, era habitual veure grups de jóvens jugant als carrers i bancals, destacant llocs com el carrer de la Sèquia o l'avinguda de Carlos Soler, on es muntaven porteries amb pedres. Es van formar diversos equips, sovint amb noms vinculats al barri o als llaços d'amistat entre els jugadors.<br><br>\
Els partits es jugaven contra equips de pobles veïns com Sant Joan o Sant Vicent, i les cròniques de premsa de l'època recullen trobades contra equips com Carolinas FC o el Gimnàstic d'Alacant. Els vestidors eren improvisats, com ara al Bar Conchita, i l'equipament i material sanitari es recollien amb molt d'esforç.<br><br>\
Amb el temps, el Mutxamel C.F. es va consolidar com a club, amb samarretes grana i pantalons blaus o blancs. Destacaren jugadors com Rafael Pastor "El Parralo", que arribà a jugar en Primera Divisió. L'equip va disputar campionats comarcals i tornejos com el "Chacón" o la Copa de "San Pedro".<br><br>\
Davant el creixement urbanístic i la falta d'instal·lacions, es van habilitar diversos camps provisionals, com al Calvari, gràcies al treball voluntari i el suport de propietaris locals. Finalment, el 1969, s'inaugurà el Camp Municipal dels Oms, amb la presència de les autoritats i la reina de les festes.<br><br>\
Aquest recorregut històric reflecteix com, a través de l'esforç col·lectiu, el futbol ha passat de ser un joc espontani entre amics a formar part essencial de la vida esportiva i social de Mutxamel, creant vincles i donant a conéixer el poble més enllà de les seues fronteres.<br><br><br>\
<em style="font-size: 0.7em;">* Text resumit de la següent publicació.</em></p>

# --- Estadistiques i Palmares (estadisticasPalmares.html) ---
estadisticas.copa.titulo=Finals de la Copa Sant Pere
estadisticas.copa.intro=Al llarg de les dècades, el Mutxamel CF ha participat en la històrica Copa Sant Pere, deixant moments de lluita i glòria. Encara que en moltes edicions el pas a la final es va resistir, destaquen les èpiques victòries per penals en 1994 i 1999 i el recent triomf en 2024 contra el San Gabriel, símbols de la garra del club.
estadisticas.posicionesLigueras.titulo=Posicions Lligueres
estadisticas.posiciones.parrafo1=El Mutxamel Club de Futbol, fundat en 1969, ha sigut un pilar del futbol local en la província d'Alacant, participant al llarg de la seua història en diverses categories regionals de la Comunitat Valenciana. Des dels seus primers anys en la Segona Regional de Múrcia, el club ha mostrat un recorregut marcat per ascensos i descensos, consolidant-se en diverses etapes en la Primera Regional i la Preferent, i arribant a disputar la Tercera Divisió en la dècada dels 90.
estadisticas.posiciones.parrafo2=Al llarg de més de cinc dècades, el Mutxamel CF ha experimentat alts i baixos en el seu rendiment, aconseguint posicions destacades com a campions de Primera Regional en diverses temporades i aconseguint en 1992 el primer lloc en Preferent, la qual cosa reflecteix la seua capacitat de superació i resiliència. En els últims anys, el club ha competit principalment en Primera FFCV, aconseguint classificacions importants, incloent la segona posició i l'ascens després d'una eliminatòria en la temporada 2025, mostrant la seua ambició per consolidar-se en categories superiors.
estadisticas.posiciones.parrafo3=Aquest historial de resultats no sols evidencia el compromis del Mutxamel CF amb l'esport local, sinó també la seua importància com a referent per a jugadors i aficionats de la zona, consolidant una trajectòria de més de 50 anys d'història futbolística.
