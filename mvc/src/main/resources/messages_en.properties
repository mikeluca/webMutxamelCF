# --- History (historia.html) ---
# NOTA: a diferencia del valenciano, aqui no habia ningun texto en ingles
# preexistente que reaprovechar; es traduccion nueva, fiel al castellano
# redactado para messages.properties.
historia.titulo=Football and footballers in Mutxamel
historia.contenido=<p class="lead"><br>\
In Mutxamel, as in many other towns, football became a very popular social activity, especially among men, who had more freedom to take part in leisure pursuits. Until the final decades of the 20th century, street games and sports were practically the exclusive preserve of men, while women played a far more restricted role.<br><br>\
With the arrival of football in Spain in the early 20th century, this sport began to take root in the town. By the 1930s, it was common to see groups of young men playing in the streets and on farming terraces, particularly in places such as Calle de la Séquia or Avenida de Carlos Soler, where goalposts were marked out with stones. Several teams were formed, often named after a neighbourhood or the friendships between the players.<br><br>\
Matches were played against teams from neighbouring towns such as Sant Joan and Sant Vicent, and press reports from the time record games against sides like Carolinas FC and Gimnàstic de Alicante. Changing rooms were makeshift, such as the one at Bar Conchita, and kit and medical supplies were obtained only through great effort.<br><br>\
Over time, Mutxamel C.F. became established as a club, playing in maroon shirts with blue or white shorts. Notable players included Rafael Pastor "El Parralo", who went on to play in Spain's Primera División. The team competed in regional championships and tournaments such as the "Chacón" and the "San Pedro" Cup.<br><br>\
Faced with urban growth and a lack of facilities, several temporary pitches were set up, such as the one at El Calvari, thanks to voluntary work and the support of local landowners. Finally, in 1969, the Los Olmos Municipal Ground was officially opened, with local authorities and the festival queen in attendance.<br><br>\
This history reflects how, through collective effort, football went from being a spontaneous game among friends to becoming an essential part of Mutxamel's sporting and social life, forging bonds and putting the town on the map far beyond its borders.<br><br><br>\
<em style="font-size: 0.7em;">* Summarised text from the following article.</em></p>

# --- Statistics & Honours (estadisticasPalmares.html) ---
estadisticas.copa.titulo=San Pedro Cup Finals
estadisticas.copa.intro=Over the decades, Mutxamel CF has taken part in the historic San Pedro Cup, producing moments of both struggle and glory. Although reaching the final proved elusive in many editions, the club is remembered for its epic penalty-shootout wins in 1994 and 1999 and its recent triumph in 2024 against San Gabriel — symbols of the club's fighting spirit.
estadisticas.posicionesLigueras.titulo=League Standings
estadisticas.posiciones.parrafo1=Mutxamel Club de Fútbol, founded in 1969, has been a pillar of local football in the province of Alicante, competing throughout its history in various regional divisions of the Valencian Community. Since its early years in Murcia's Segunda Regional, the club has followed a path marked by promotions and relegations, establishing itself over several spells in Primera Regional and Preferente, and even reaching Tercera División in the 1990s.
estadisticas.posiciones.parrafo2=Over more than five decades, Mutxamel CF has experienced ups and downs in its performances, achieving standout results such as winning Primera Regional in several seasons and finishing top of Preferente in 1992, reflecting its resilience and capacity for improvement. In recent years, the club has competed mainly in Primera FFCV, achieving important finishes including a second-place finish and promotion via the play-offs in the 2025 season, showing its ambition to establish itself in higher divisions.
estadisticas.posiciones.parrafo3=This record of results is evidence not only of Mutxamel CF's commitment to local football, but also of its importance as a reference point for players and fans in the area, consolidating a history spanning more than 50 years of footballing tradition.
