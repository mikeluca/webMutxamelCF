# Templates of the emails sent to app users. English. UTF-8 encoding.
# Named placeholders between braces ({saludo}, {codigo}...): literal substitution (this is not MessageFormat).
# "\n" is a line break and a trailing "\" continues the value on the next line.
# The club's internal emails (orders, contact, FFCV, reports) do not use these templates: they are in Spanish in the code.

saludo.conNombre=Hello {nombre}:
saludo.sinNombre=Hello:
saludo.invitacion.conNombre=Hello {nombre},
saludo.invitacion.sinNombre=Hello,

# ---------- Invitation to activate the account (sent in the three languages, with a separator) ----------
invitacion.asunto=Activate your Mutxamel CF app account
invitacion.cuerpo={saludo}\n\
\n\
Your access to the official Mutxamel Club de Futbol app has been created.\n\
\n\
To activate your account, open the app, go to "Club Area - Activate account" \
and enter your email, the following code and the password you want to use:\n\
\n\
{codigo}\n\
\n\
This code expires in 48 hours and can only be used 5 times. If you don't use it \
in time or enter it wrongly several times, ask the club office to \
resend the invitation.\n\
\n\
If you weren't expecting this email, you can ignore it.

# ---------- Account activated ----------
cuentaActivada.asunto=Your Mutxamel CF app account is now activated!
cuentaActivada.cuerpo={saludo}\n\
\n\
Your official Mutxamel CF app account has been activated successfully. \
From now on you can sign in to the Club Area with your email and the password you chose.\n\
\n\
What you can do with your account\n\
• See the training and match calendar of your teams.\n\
• Check upcoming matches and results.\n\
• Receive notices and private messages from the club, the coaches and the coordinators, \
and write to them from the app.\n\
• Receive notifications on your phone. You can choose which ones in Settings, \
where you can also change the language and the theme.\n\
{roles}\
\n\
If you need help, write to us at mutxamelcf.gestion@gmail.com.\n\
You can delete your account whenever you want from Settings › Delete my account.\n\
\n\
See you on the pitch!\n\
Mutxamel CF

rol.JUGADOR=\nAs a player\n\
• You see your training sessions and matches in the calendar, and the details of each call-up: meeting time and place, kit and who is called up.\n\
• You can let us know you will miss a training session or a match before it takes place.\n\
• If you are called up with another club team, you will also see it in your calendar.\n\
• You can write to your coach and to the coordinators.\n
rol.FAMILIAR=\nAs a family member\n\
• In "My players" you see the players linked to your account and a summary of their season.\n\
• You see their call-ups, also when they are called up with another club team, and their training attendance.\n\
• You can justify their absences from training sessions and matches in advance.\n\
• At the end of the season, the app will ask you whether they will continue at the club.\n\
• You can write to their coaches and to the coordinators.\n
rol.ENTRENADOR=\nAs a coach\n\
• In "My teams" you take attendance and record who came to each training session.\n\
• You prepare the call-ups (with the kit) and can invite players from other club teams.\n\
• You record the result and the statistics of the matches.\n\
• You manage the schedules and training sessions of your teams, and you can cancel a training session, notifying players and families.\n\
• You receive a notice when a family justifies an absence.\n\
• You send notices to your teams and messages to players and families.\n
rol.COORDINADOR=\nAs a coordinator\n\
• You have access to all the club's teams in "My teams": attendance, call-ups, matches and calendar.\n\
• You approve the invitations of players to other teams and, in summer, you assign the players to the teams of the new season.\n\
• You can send notices to teams or to whole categories, and messages to any player, family or coach.\n
rol.RETRANSMISION=\nAs the live broadcast person\n\
• In "Live match" you publish the first team's live notices during the matches.\n

# ---------- Code to change the password ----------
codigoRecuperacion.asunto=Code to change your password
codigoRecuperacion.cuerpo={saludo}\n\
\n\
You have asked to change the password of your Mutxamel CF app account. \
Open the app, go to "Club Area - Forgot your password?" and enter \
this code together with the new password:\n\
\n\
{codigo}\n\
\n\
The code expires in {minutos} minutes and can only be tried 5 times.\n\
\n\
If it wasn't you, ignore this message: your password will not change.\n\
\n\
Mutxamel CF

# ---------- Password changed ----------
contrasenaCambiada.asunto=Your password has been changed
contrasenaCambiada.cuerpo={saludo}\n\
\n\
Your password has been changed. Sessions open on other devices will be \
closed and you will have to sign in with the new password.\n\
\n\
If it wasn't you, write to us as soon as possible at mutxamelcf.gestion@gmail.com.\n\
\n\
Mutxamel CF

# ---------- Account without players ----------
cuentaSinJugadores.asunto=Your Mutxamel CF app account will be deactivated
cuentaSinJugadores.cuerpo={saludo}\n\
\n\
Your Mutxamel CF app account no longer has any active player linked to it. \
If it stays that way, it will be deactivated on {fecha}.\n\
\n\
If this is a mistake, or if your player is still with us, write to us at \
mutxamelcf.gestion@gmail.com and we will sort it out. If there is an active player again \
before that date, nothing will happen.\n\
\n\
Mutxamel CF
