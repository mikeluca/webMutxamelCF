# Templates of the emails sent to app users. English. UTF-8 encoding.
# Named placeholders between braces ({saludo}, {codigo}...): literal substitution (this is not MessageFormat).
# "\n" is a line break and a trailing "\" continues the value on the next line.
# The club's internal emails (orders, contact, FFCV, reports) do not use these templates: they are in Spanish in the code.

saludo.conNombre=Hello {nombre}:
saludo.sinNombre=Hello:
saludo.invitacion.conNombre=Hello {nombre},
saludo.invitacion.sinNombre=Hello,

# ---------- Invitation to activate the account (sent in the three languages, with a separator) ----------
invitacion.asunto=Activate your Mutxamel C.F. app account
invitacion.cuerpo={saludo}\n\
\n\
Your access to the official Mutxamel C.F. app has been created.\n\
\n\
To activate your account, open the app, go to "Club Area - Activate account" \
and enter your email, the following code and the password you want to use:\n\
\n\
{codigo}\n\
\n\
This code expires in {dias} days and can only be used 5 times. If you don't use it \
in time or enter it wrongly several times, ask the club office to \
resend the invitation.\n\
\n\
If you weren't expecting this email, you can ignore it.

# ---------- Account activated ----------
cuentaActivada.asunto=Your Mutxamel C.F. app account is now activated!
cuentaActivada.cuerpo={saludo}\n\
\n\
Your official Mutxamel C.F. app account has been activated successfully. \
From now on you can sign in to the Club Area with your email and the password you chose.\n\
\n\
What you can do with your account\n\
• See the training and match calendar of your teams.\n\
• Check upcoming matches and results.\n\
• Follow the First Team matches live and add matches to your calendar.\n\
• Receive notices and private messages from the club, the coaches and the coordinators, \
and write to them from the app.\n\
• Receive notifications on your phone. You can choose which ones in Settings, \
where you can also change the language and the theme.\n\
{roles}\
\n\
If you need help, write to us at mutxamelcf.gestion@gmail.com.\n\
You can delete your account whenever you want from Settings › Delete my account.\n\
\n\
See you on the pitch!\n\
Mutxamel C.F.

rol.JUGADOR=\nAs a player\n\
• You see your training sessions and matches in the calendar, and the details of each call-up: meeting time and place, kit and who is called up.\n\
• You can let us know you will miss a training session or a match before it takes place.\n\
• If you are called up with another club team, you will also see it in your calendar.\n\
• You can write to your coach and to the coordinators.\n
rol.FAMILIAR=\nAs a family member\n\
• In "My players" you see the players linked to your account and a summary of their season.\n\
• You see their call-ups, also when they are called up with another club team, and their training attendance.\n\
• You can justify their absences from training sessions and matches in advance.\n\
• At the end of the season, the app will ask you whether they will continue at the club.\n\
• You can write to their coaches and to the coordinators.\n\
• If you have another child at the club, you can ask for access from the app ("Ask for access to another player").\n
rol.ENTRENADOR=\nAs a coach\n\
• In "My teams" you take attendance and record who came to each training session.\n\
• You prepare the call-ups (with the kit) and can invite players from other club teams.\n\
• You record the result and the statistics of the matches.\n\
• You change the shirt number and position of your players.\n\
• You manage the schedules and training sessions of your teams, and you can cancel a training session, notifying players and families.\n\
• You receive a notice when a family justifies an absence.\n\
• You send notices to your teams and messages to players and families.\n\
• You review the access requests from your players' families.\n
rol.COORDINADOR=\nAs a coordinator\n\
• You have access to all the club's teams in "Coordination › All teams": attendance, call-ups, matches and calendar.\n\
• You approve the invitations of players to other teams and, in summer, you assign the players to the teams of the new season.\n\
• You can send notices to teams or to whole categories, and messages to any player, family or coach.\n\
• In "Weekend" you see the status of the matchday and the preview and results images, ready to publish on social media.\n\
• You review the families' access requests.\n
rol.RETRANSMISION=\nAs the live broadcast person\n\
• In "Live match" you publish the lineup, goals, substitutions and cards of the First Team during the matches; everything is shown on the match sheet. This role is only for the live match.\n
rol.RRSS=\nFor the club's social media\n\
• In "Live and social media › Social media images" you generate the weekend preview and results and the posters for the next match of the First Team and the Reserve Team, ready to publish.\n
rol.ADMIN_APP=\nAs the app administrator\n\
• You review the reported messages in "Moderation" and manage the accounts pending activation.\n\
• You can invite new users and check the status of the app.\n

# ---------- Code to change the password ----------
codigoRecuperacion.asunto=Code to change your password
codigoRecuperacion.cuerpo={saludo}\n\
\n\
You have asked to change the password of your Mutxamel C.F. app account. \
Open the app, go to "Club Area - Forgot your password?" and enter \
this code together with the new password:\n\
\n\
{codigo}\n\
\n\
The code expires in {minutos} minutes and can only be tried 5 times.\n\
\n\
If it wasn't you, ignore this message: your password will not change.\n\
\n\
Mutxamel C.F.

# ---------- Password changed ----------
contrasenaCambiada.asunto=Your password has been changed
contrasenaCambiada.cuerpo={saludo}\n\
\n\
Your password has been changed. Sessions open on other devices will be \
closed and you will have to sign in with the new password.\n\
\n\
If it wasn't you, write to us as soon as possible at mutxamelcf.gestion@gmail.com.\n\
\n\
Mutxamel C.F.

# ---------- Account without players ----------
cuentaSinJugadores.asunto=Your Mutxamel C.F. app account will be deactivated
cuentaSinJugadores.cuerpo={saludo}\n\
\n\
Your Mutxamel C.F. app account no longer has any active player linked to it. \
If it stays that way, it will be deactivated on {fecha}.\n\
\n\
If this is a mistake, or if your player is still with us, write to us at \
mutxamelcf.gestion@gmail.com and we will sort it out. If there is an active player again \
before that date, nothing will happen.\n\
\n\
If you have another child at the club, you can ask for access from the app ("Ask for access to another player") and the account will stay active.\n\
\n\
Mutxamel C.F.

# ---------- Code to confirm the email of a family access request ----------
solicitudFamilia.asunto=Confirm your email for your access request in the Mutxamel C.F. app
solicitudFamilia.cuerpo={saludo}\n\
\n\
You have asked for access to the Mutxamel C.F. app as a relative of a player. This code is only \
to confirm the email of the request. Open the app and enter it together with the password you \
want to use:\n\
\n\
{codigo}\n\
\n\
The code expires in {dias} days and can only be used 5 times. Once you confirm your email, the club \
will review your request and let you know in the app. Until the club approves it you will not see \
any information about the player.\n\
\n\
If it wasn't you, ignore this message: nothing will be activated.\n\
\n\
Mutxamel C.F.

# ---------- Access request approved (first child) ----------
solicitudFamiliaAprobada.asunto=You now have access to the Mutxamel C.F. app
solicitudFamiliaAprobada.cuerpo={saludo}\n\
\n\
The club has approved your request. You can now see the information of {jugadores} in the app: \
sign in to the Club Area with your email and password.\n\
{roles}\
\n\
If you need help, write to us at mutxamelcf.gestion@gmail.com.\n\
\n\
See you on the pitch!\n\
Mutxamel C.F.

# ---------- Access request approved (another child of the same request) ----------
solicitudFamiliaOtroAprobado.asunto=Access approved for {jugador}
solicitudFamiliaOtroAprobado.cuerpo={saludo}\n\
\n\
The club has also approved access to the information of {jugador}.\n\
\n\
Mutxamel C.F.

# ---------- Access request rejected ----------
solicitudFamiliaRechazada.asunto=About your access request in the Mutxamel C.F. app
solicitudFamiliaRechazada.cuerpo={saludo}\n\
\n\
The club could not approve access to the information of {jugador}.{motivo}\n\
\n\
If you think this is a mistake, write to us at mutxamelcf.gestion@gmail.com.\n\
\n\
Mutxamel C.F.
solicitudFamiliaRechazada.motivo=\n\nReason: {motivo}

# ---------- Access request expired (only when it expires without having been reviewed) ----------
solicitudFamiliaCaducada.asunto=Your access request in the Mutxamel C.F. app has expired
solicitudFamiliaCaducada.cuerpo.cuentaBorrada={saludo}\n\
\n\
Your access request to the Mutxamel C.F. app has expired because it was not completed within 7 days, \
and we have deleted the request data.\n\
\n\
If you still want access, you can ask for it again from the app, under "I'm a relative of a player".\n\
\n\
Mutxamel C.F.
solicitudFamiliaCaducada.cuerpo.cuentaConservada={saludo}\n\
\n\
Your access request to the Mutxamel C.F. app has expired because it was not completed within 7 days, \
and we have deleted the request data.\n\
\n\
If you still want access, you can ask for it again from the app, under "Ask for access to another player".\n\
\n\
Mutxamel C.F.

