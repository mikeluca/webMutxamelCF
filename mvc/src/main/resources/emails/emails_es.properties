Mutxamel C.F.

# ---------- Cuenta sin jugadores ----------
cuentaSinJugadores.asunto=Tu cuenta de la app del Mutxamel C.F. se desactivará
cuentaSinJugadores.cuerpo={saludo}\n\
\n\
Tu cuenta de la app del Mutxamel C.F. ya no tiene ningún jugador activo vinculado. \
Si sigue así, se desactivará el {fecha}.\n\
\n\
Si es un error, o si tu jugador sigue con nosotros, escríbenos a \
mutxamelcf.gestion@gmail.com y lo arreglamos. Si vuelve a haber un jugador activo \
antes de esa fecha, no pasará nada.\n\
\n\
Si tienes otro hijo o hija en el club, puedes pedir acceso desde la app («Pedir acceso a otro jugador») y la cuenta seguirá activa.\n\
\n\
Mutxamel C.F.

# ---------- Código para confirmar el email de una solicitud de acceso de familia ----------
solicitudFamilia.asunto=Confirma tu email para la solicitud de acceso en la app del Mutxamel C.F.
solicitudFamilia.cuerpo={saludo}\n\
\n\
Has pedido acceso a la app del Mutxamel C.F. como familiar de un jugador. Este código es solo \
para confirmar el email de la solicitud. Abre la app e introdúcelo junto con la contraseña que \
quieras usar:\n\
\n\
{codigo}\n\
\n\
El código caduca en {dias} días y solo se puede usar 5 veces. Cuando confirmes el email, el club \
revisará tu solicitud y te avisaremos en la app. Hasta que el club la apruebe no verás ningún dato \
del jugador.\n\
\n\
Si no has sido tú, ignora este mensaje: no se activará nada.\n\
\n\
Mutxamel C.F.

