\n\
Tu cuenta de la app del Mutxamel CF ya no tiene ningún jugador activo vinculado. \
Si sigue así, se desactivará el {fecha}.\n\
\n\
Si es un error, o si tu jugador sigue con nosotros, escríbenos a \
