# Plantillas de los emails a usuarios de la app. Castellano. Codificación UTF-8.
# Marcadores con nombre entre llaves ({saludo}, {codigo}...): sustitución literal (no es MessageFormat).
# "\n" es un salto de línea y una "\" al final de línea continúa el valor en la línea siguiente.
# Los emails internos del club (pedidos, contacto, FFCV, reportes) no usan estas plantillas: van en castellano en el código.

saludo.conNombre=Hola {nombre}:
saludo.sinNombre=Hola:
saludo.invitacion.conNombre=Hola {nombre},
saludo.invitacion.sinNombre=Hola,

# ---------- Invitación para activar la cuenta (va en los tres idiomas, con separador) ----------
invitacion.asunto=Activa tu cuenta de la app del Mutxamel CF
invitacion.cuerpo={saludo}\n\
\n\
Se ha creado tu acceso a la app oficial del Mutxamel Club de Futbol.\n\
\n\
Para activar tu cuenta abre la app, entra en "Área Club - Activar cuenta" \
e introduce tu email, el siguiente código y la contraseña que quieras usar:\n\
\n\
{codigo}\n\
\n\
Este código caduca en 48 horas y solo se puede usar 5 veces. Si no lo usas a \
tiempo o lo introduces mal varias veces, pide a la oficina del club que te \
reenvíe la invitación.\n\
\n\
Si no esperabas este email, puedes ignorarlo.

# ---------- Cuenta activada ----------
cuentaActivada.asunto=¡Tu cuenta de la app del Mutxamel CF ya está activada!
cuentaActivada.cuerpo={saludo}\n\
\n\
Tu cuenta de la app oficial del Mutxamel CF se ha activado correctamente. \
A partir de ahora puedes entrar en el Área Club con tu email y la contraseña que elegiste.\n\
\n\
Qué puedes hacer con tu cuenta\n\
• Ver el calendario de entrenamientos y partidos de tus equipos.\n\
• Consultar los próximos partidos y resultados.\n\
• Recibir avisos y mensajes privados del club, los entrenadores y la coordinación, \
y escribirles desde la app.\n\
• Recibir notificaciones en el móvil. Puedes elegir cuáles en Ajustes, \
donde también cambias el idioma y el tema.\n\
{roles}\
\n\
Si necesitas ayuda, escríbenos a mutxamelcf.gestion@gmail.com.\n\
Puedes eliminar tu cuenta cuando quieras desde Ajustes › Eliminar mi cuenta.\n\
\n\
¡Nos vemos en el campo!\n\
Mutxamel CF

rol.JUGADOR=\nComo jugador\n\
• Ves en el calendario tus entrenamientos y partidos, y el detalle de cada convocatoria: hora y lugar de citación, equipaje y quién va convocado.\n\
• Puedes avisar de que faltarás a un entrenamiento o a un partido antes de que se celebre.\n\
• Si te convocan con otro equipo del club, también lo verás en tu calendario.\n\
• Puedes escribir a tu entrenador y a la coordinación.\n
rol.FAMILIAR=\nComo familiar\n\
• En «Mis jugadores» ves a los jugadores vinculados a tu cuenta y el resumen de su temporada.\n\
• Ves sus convocatorias, también si los convocan con otro equipo del club, y su asistencia a los entrenamientos.\n\
• Puedes justificar sus faltas a entrenamientos y partidos con antelación.\n\
• Al final de la temporada, la app te preguntará si seguirán en el club.\n\
• Puedes escribir a sus entrenadores y a la coordinación.\n
rol.ENTRENADOR=\nComo entrenador\n\
• En «Mis equipos» pasas lista y registras la asistencia de cada entrenamiento.\n\
• Preparas las convocatorias (con el equipaje) y puedes invitar a jugadores de otros equipos del club.\n\
• Registras el resultado y las estadísticas de los partidos.\n\
• Gestionas los horarios y entrenamientos de tus equipos, y puedes cancelar un entrenamiento avisando a jugadores y familias.\n\
• Recibes un aviso cuando una familia justifica una falta o una ausencia.\n\
• Envías avisos a tus equipos y mensajes a jugadores y familias.\n
rol.COORDINADOR=\nComo coordinador\n\
• Tienes acceso a todos los equipos del club en «Mis equipos»: asistencia, convocatorias, partidos y calendario.\n\
• Apruebas las invitaciones de jugadores a otros equipos y, en verano, repartes a los jugadores en los equipos de la nueva temporada.\n\
• Puedes enviar avisos a equipos o a categorías completas, y mensajes a cualquier jugador, familia o entrenador.\n
rol.RETRANSMISION=\nComo responsable de retransmisión\n\
• En «Partido en directo» publicas los avisos en directo del primer equipo durante los partidos.\n

# ---------- Código para cambiar la contraseña ----------
codigoRecuperacion.asunto=Código para cambiar tu contraseña
codigoRecuperacion.cuerpo={saludo}\n\
\n\
Has pedido cambiar la contraseña de tu cuenta de la app del Mutxamel CF. \
Abre la app, entra en "Área Club - ¿Has olvidado tu contraseña?" e introduce \
este código junto con la contraseña nueva:\n\
\n\
{codigo}\n\
\n\
El código caduca en {minutos} minutos y solo se puede probar 5 veces.\n\
\n\
Si no lo has pedido tú, ignora este mensaje: tu contraseña no cambiará.\n\
\n\
Mutxamel CF

