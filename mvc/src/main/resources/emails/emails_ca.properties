# Plantilles dels correus als usuaris de l'app. Valencià. Codificació UTF-8.
# Marcadors amb nom entre claus ({saludo}, {codigo}...): substitució literal (no és MessageFormat).
# "\n" és un salt de línia i una "\" al final de línia continua el valor en la línia següent.
# Els correus interns del club (comandes, contacte, FFCV, reports) no usen estes plantilles: van en castellà en el codi.

saludo.conNombre=Hola {nombre}:
saludo.sinNombre=Hola:
saludo.invitacion.conNombre=Hola {nombre},
saludo.invitacion.sinNombre=Hola,

# ---------- Invitació per a activar el compte (va en els tres idiomes, amb separador) ----------
invitacion.asunto=Activa el teu compte de l'app del Mutxamel CF
invitacion.cuerpo={saludo}\n\
\n\
S'ha creat el teu accés a l'app oficial del Mutxamel Club de Futbol.\n\
\n\
Per a activar el teu compte obri l'app, entra a "Àrea Club - Activar compte" \
i introdueix el teu email, el codi següent i la contrasenya que vulgues usar:\n\
\n\
{codigo}\n\
\n\
Este codi caduca en 48 hores i només es pot usar 5 vegades. Si no l'uses a \
temps o l'introdueixes malament diverses vegades, demana a l'oficina del club que et \
reenvie la invitació.\n\
\n\
Si no esperaves este correu, pots ignorar-lo.

# ---------- Compte activat ----------
cuentaActivada.asunto=El teu compte de l'app del Mutxamel CF ja està activat!
cuentaActivada.cuerpo={saludo}\n\
\n\
El teu compte de l'app oficial del Mutxamel CF s'ha activat correctament. \
A partir d'ara pots entrar a l'Àrea Club amb el teu email i la contrasenya que vas triar.\n\
\n\
Què pots fer amb el teu compte\n\
• Veure el calendari d'entrenaments i partits dels teus equips.\n\
• Consultar els pròxims partits i resultats.\n\
• Rebre avisos i missatges privats del club, els entrenadors i la coordinació, \
i escriure'ls des de l'app.\n\
• Rebre notificacions al mòbil. Pots triar quines a Ajustos, \
on també canvies l'idioma i el tema.\n\
{roles}\
\n\
Si necessites ajuda, escriu-nos a mutxamelcf.gestion@gmail.com.\n\
Pots eliminar el teu compte quan vulgues des d'Ajustos › Eliminar el meu compte.\n\
\n\
Ens veiem al camp!\n\
Mutxamel CF

rol.JUGADOR=\nCom a jugador\n\
• Veus al calendari els teus entrenaments i partits, i el detall de cada convocatòria: hora i lloc de citació, equipació i qui va convocat.\n\
• Pots avisar que faltaràs a un entrenament o a un partit abans que se celebre.\n\
• Si et convoquen amb un altre equip del club, també ho veuràs al teu calendari.\n\
• Pots escriure al teu entrenador i a la coordinació.\n
rol.FAMILIAR=\nCom a familiar\n\
• A «Els meus jugadors» veus els jugadors vinculats al teu compte i el resum de la seua temporada.\n\
• Veus les seues convocatòries, també si els convoquen amb un altre equip del club, i la seua assistència als entrenaments.\n\
• Pots justificar les seues faltes a entrenaments i partits amb antelació.\n\
• Al final de la temporada, l'app et preguntarà si continuaran al club.\n\
• Pots escriure als seus entrenadors i a la coordinació.\n
rol.ENTRENADOR=\nCom a entrenador\n\
• A «Els meus equips» passes llista i registres l'assistència de cada entrenament.\n\
• Prepares les convocatòries (amb l'equipació) i pots convidar jugadors d'altres equips del club.\n\
• Registres el resultat i les estadístiques dels partits.\n\
• Gestiones els horaris i entrenaments dels teus equips, i pots cancel·lar un entrenament avisant jugadors i famílies.\n\
• Reps un avís quan una família justifica una falta o una absència.\n\
• Envies avisos als teus equips i missatges a jugadors i famílies.\n
rol.COORDINADOR=\nCom a coordinador\n\
• Tens accés a tots els equips del club a «Els meus equips»: assistència, convocatòries, partits i calendari.\n\
• Aproves les invitacions de jugadors a altres equips i, a l'estiu, reparteixes els jugadors en els equips de la nova temporada.\n\
• Pots enviar avisos a equips o a categories completes, i missatges a qualsevol jugador, família o entrenador.\n
rol.RETRANSMISION=\nCom a responsable de retransmissió\n\
• A «Partit en directe» publiques els avisos en directe del primer equip durant els partits.\n

# ---------- Codi per a canviar la contrasenya ----------
codigoRecuperacion.asunto=Codi per a canviar la teua contrasenya
codigoRecuperacion.cuerpo={saludo}\n\
\n\
Has demanat canviar la contrasenya del teu compte de l'app del Mutxamel CF. \
Obri l'app, entra a "Àrea Club - Has oblidat la teua contrasenya?" i introdueix \
aquest codi junt amb la contrasenya nova:\n\
\n\
{codigo}\n\
\n\
El codi caduca en {minutos} minuts i només es pot provar 5 vegades.\n\
\n\
Si no ho has demanat tu, ignora aquest missatge: la teua contrasenya no canviarà.\n\
\n\
Mutxamel CF

# ---------- Contrasenya canviada ----------
contrasenaCambiada.asunto=La teua contrasenya s'ha canviat
contrasenaCambiada.cuerpo={saludo}\n\
\n\
La teua contrasenya s'ha canviat. Les sessions obertes en altres dispositius es \
tancaran i hauràs d'entrar amb la contrasenya nova.\n\
\n\
Si no has sigut tu, escriu-nos com més prompte millor a mutxamelcf.gestion@gmail.com.\n\
\n\
Mutxamel CF

# ---------- Compte sense jugadors ----------
cuentaSinJugadores.asunto=El teu compte de l'app del Mutxamel CF es desactivarà
cuentaSinJugadores.cuerpo={saludo}\n\
\n\
El teu compte de l'app del Mutxamel CF ja no té cap jugador actiu vinculat. \
Si continua així, es desactivarà el {fecha}.\n\
\n\
Si és un error, o si el teu jugador continua amb nosaltres, escriu-nos a \
mutxamelcf.gestion@gmail.com i ho arreglem. Si torna a haver-hi un jugador actiu \
abans d'eixa data, no passarà res.\n\
\n\
Mutxamel CF
