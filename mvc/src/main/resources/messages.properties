# --- Historia (historia.html) ---
historia.titulo=Fútbol y futbolistas en Mutxamel
historia.contenido=<p class="lead"><br>\
En Mutxamel, como en otras muchas poblaciones, el fútbol se convirtió en una actividad social muy popular, especialmente entre los hombres, que disponían de más libertad para practicar actividades lúdicas. Hasta las últimas décadas del siglo XX, los juegos de calle y los deportes eran prácticamente exclusivos de los hombres, mientras las mujeres tenían un papel mucho más restringido.<br><br>\
Con la llegada del fútbol a España a principios del siglo XX, esta modalidad deportiva empezó a arraigar en el pueblo. Ya en los años treinta, era habitual ver grupos de jóvenes jugando en las calles y bancales, destacando lugares como la calle de la Séquia o la avenida de Carlos Soler, donde se montaban porterías con piedras. Se formaron varios equipos, a menudo con nombres vinculados al barrio o a los lazos de amistad entre los jugadores.<br><br>\
Los partidos se jugaban contra equipos de pueblos vecinos como Sant Joan o Sant Vicent, y las crónicas de prensa de la época recogen encuentros contra equipos como Carolinas FC o el Gimnástic de Alicante. Los vestuarios eran improvisados, como en el Bar Conchita, y el equipamiento y material sanitario se consegían con mucho esfuerzo.<br><br>\
Con el tiempo, el Mutxamel C.F. se consolidó como club, con camisetas granas y pantalones azules o blancos. Destacaron jugadores como Rafael Pastor "El Parralo", que llegó a jugar en Primera División. El equipo disputó campeonatos comarcales y torneos como el "Chacón" o la Copa de "San Pedro".<br><br>\
Ante el crecimiento urbanístico y la falta de instalaciones, se habilitaron varios campos provisionales, como en el Calvari, gracias al trabajo voluntario y al apoyo de propietarios locales. Finalmente, en 1969, se inauguró el Campo Municipal de los Olmos, con la presencia de las autoridades y la reina de las fiestas.<br><br>\
Este recorrido histórico refleja cómo, a través del esfuerzo colectivo, el fútbol ha pasado de ser un juego espontáneo entre amigos a formar parte esencial de la vida deportiva y social de Mutxamel, creando vínculos y dando a conocer el pueblo más allá de sus fronteras.<br><br><br>\
<em style="font-size: 0.7em;">* Texto resumido de la siguiente publicación.</em></p>

# --- Estadisticas y Palmares (estadisticasPalmares.html) ---
estadisticas.copa.titulo=Finales de la Copa San Pedro
estadisticas.copa.intro=A lo largo de las décadas, el Mutxamel CF ha participado en la histórica Copa San Pedro, dejando momentos de lucha y gloria. Aunque en muchas ediciones el pase a la final se resistió, destacan las épicas victorias por penaltis en 1994 y 1999 y el reciente triunfo en 2024 contra el San Gabriel, símbolos de la garra del club.
estadisticas.posicionesLigueras.titulo=Posiciones Ligueras
estadisticas.posiciones.parrafo1=El Mutxamel Club de Fútbol, fundado en 1969, ha sido un pilar del fútbol local en la provincia de Alicante, participando a lo largo de su historia en diversas categorías regionales de la Comunidad Valenciana. Desde sus primeros años en la Segunda Regional de Murcia, el club ha mostrado un recorrido marcado por ascensos y descensos, consolidándose en varias etapas en la Primera Regional y la Preferente, y llegando a disputar la Tercera División en la década de los 90.
estadisticas.posiciones.parrafo2=A lo largo de más de cinco décadas, el Mutxamel CF ha experimentado altibajos en su rendimiento, alcanzando posiciones destacadas como campeones de Primera Regional en varias temporadas y consiguiendo en 1992 el primer puesto en Preferente, lo que refleja su capacidad de superación y resiliencia. En los últimos años, el club ha competido principalmente en Primera FFCV, logrando clasificaciones importantes, incluyendo la segunda posición y el ascenso después de una eliminatoria en la temporada 2025, mostrando su ambición por consolidarse en categorías superiores.
estadisticas.posiciones.parrafo3=Este historial de resultados no solo evidencia el compromiso del Mutxamel CF con el deporte local, sino también su importancia como referente para jugadores y aficionados de la zona, consolidando una trayectoria de más de 50 años de historia futbolística.
