	<style>
		/* Estilo para la galería de imágenes */
		.image-gallery {
			display: flex;
			/* Usamos flexbox para alinear las imágenes */
			justify-content: center;
			/* Centrar las imágenes */
			flex-wrap: wrap;
			/* Permitir que las imágenes se ajusten en varias filas */
			gap: 15px;
			/* Espacio entre las imágenes */
		}

		.image-gallery img {
			width: 200px;
			/* Ancho de las miniaturas */
			height: auto;
			/* Mantener proporciones */
			transition: transform 0.5s;
			/* Transición suave para el aumento de tamaño */
		}

		.image-gallery img:hover {
			transform: scale(1.5);
			/* Aumentar ligeramente el tamaño al pasar el mouse */
		}
