<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container my-5 lead">
		<div class="container my-5">
			<div th:if="${noticia.imagenBase64 != null}">
				<img th:src="'data:image/jpeg;base64,' + ${noticia.imagenBase64}" class="img-fluid"
					alt="Imagen de Noticia" />
			</div>
			<div th:if="${noticia.imagenBase64 == null}">
				<img th:src="@{/images/noticia3.jpg}" class="img-fluid" alt="Imagen Noticia">
			</div>
			<h2 class="text-center fw-bold" th:utext="${noticia.titulo}" style="margin: 20px;"></h2>
			<p class="text-center text-muted mb-2" th:text="${#dates.format(noticia.fecha,'dd/MM/yyyy')}"
				style="font-size: 1.2rem;"></p>
			<div class="mt-4" th:utext="${noticia.contenido}"></div>
			<div class="text-center mt-4">
				<a href="/index" class="btn btn-secondary">Volver a Inicio</a>
			</div>
		</div>
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
