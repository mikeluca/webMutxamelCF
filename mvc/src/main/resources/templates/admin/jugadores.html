<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Mostrar mensaje de error si existe -->
	<div th:if="${param.error}" style="color: red;">
		<p th:text="${param.error}"></p>
	</div>

	<!-- Incluir el header -->
	<div th:replace="~{admin/cabeceraAdmin.html}"></div>

	<div class="container mt-5 lead">
		<h1 class="text-center">Gestión de Jugadores</h1>

		<!-- Botones -->
		<div class="d-flex justify-content-between align-items-center mb-4">
			<!-- Filtro por categoría -->
			<form class="d-flex align-items-center" action="/admin/jugadores" method="get">
				<label for="categoria" class="me-2 mb-0">Categoría:</label>
				<select id="categoria" name="categoria" class="form-control me-3">
					<option value="">Todos</option>
					<option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria}"></option>
				</select>
				<button type="submit" class="btn btn-primary">Filtrar</button>
			</form>

			<!-- Nuevo Jugador -->
			<button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#jugadorModal">
				Nuevo Jugador
			</button>
		</div>

		<!-- Tabla de jugadores -->
		<table class="table table-striped w-100">
			<thead>
				<tr>
					<th style="width: 20%;">Deporte</th> <!-- Ajuste mínimo para la columna de categoría -->
					<th style="width: 50%;">Nombre completo</th> <!-- Ajusta el ancho de la columna -->
					<th style="width: 25%;">Equipo</th> <!-- Ajuste mínimo para la columna de equipo -->
					<th style="width: 5%;"></th> <!-- Ajuste mínimo para la columna de botones -->
				</tr>
			</thead>
			<tbody>
				<tr th:each="jugador : ${jugadores}">
					<td
						th:text="${jugador.deporte} == 'F' ? 'Fútbol' : (${jugador.deporte} == 'FS' ? 'Fútbol Sala' : '')">
					</td>
					<td th:text="${jugador.nombre} + ' ' + ${jugador.apellidos}"></td>
					<td th:text="${jugador.equipo}"></td>
					<td>
						<div class="d-flex justify-content-center align-items-center gap-2">
							<!-- Botón Editar -->
							<button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal"
								data-bs-target="#jugadorModal" th:attr="data-id=${jugador.id},
							                     data-nombre=${jugador.nombre},
							                     data-apellidos=${jugador.apellidos},
							                     data-dorsal=${jugador.dorsal},
							                     data-posicion=${jugador.posicion},
							                     data-equipo=${jugador.equipo}" title="Editar jugador" onclick="abrirModalEditar(this)">
								<i class="bi bi-pencil"></i>
							</button>
							<!-- Botón Borrar -->
							<form th:action="@{'/admin/jugadores/borrar/' + ${jugador.id}}" method="post"
								style="display:inline;">
								<button type="submit" class="btn btn-danger btn-sm"
									onclick="return confirm('¿Estás seguro de que deseas borrar este jugador?');"
									title="Borrar jugador">
									<i class="bi bi-trash"></i>
								</button>
							</form>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<!-- Modal -->
	<div class="modal fade lead" id="jugadorModal" tabindex="-1" aria-labelledby="jugadorModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h3 class="modal-title lead" id="jugadorModalLabel">Jugador</h3>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>
				<form id="jugadorForm" enctype="multipart/form-data" method="post">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
					<div class="modal-body">
						<div id="mensajeModal" class="alert" style="display:none; margin: 10px;"></div>
						<div class="row">
							<div class="col-md-6">
								<input type="hidden" id="id" name="id">
								<div class="mb-3">
									<label for="nombre">Nombre:</label>
									<input type="text" class="form-control" id="nombre" name="nombre" required>
								</div>
								<div class="mb-3">
									<label for="posicion">Posición:</label>
									<input type="text" class="form-control" id="posicion" name="posicion">
								</div>
								<div class="mb-3">
									<label for="equipo">Equipo:</label>
									<select id="equipo" name="equipo" class="form-control" required>
										<option th:each="equipo : ${listaEquipos}" th:value="${equipo.id}"
											th:text="${equipo.nombre}"></option>
									</select>
								</div>
								<div class="mb-3">
									<label for="foto">Subir Foto</label>
									<input type="file" class="form-control" id="foto" name="foto" accept="image/*">
								</div>
							</div>
							<div class="col-md-6">
								<div class="mb-3">
									<label for="apellidos">Apellidos:</label>
									<input type="text" class="form-control" id="apellidos" name="apellidos" required>
								</div>
								<div class="mb-3">
									<label for="dorsal">Dorsal:</label>
									<input type="number" class="form-control" id="dorsal" name="dorsal">
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
						<button type="submit" class="btn btn-primary" onclick="guardarJugador(event)">Guardar
							Cambios</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Incluir el footer -->
	<div th:replace="~{admin/footerAdmin.html}"></div>

	<script>
		const jugadorModal = document.getElementById('jugadorModal');

		// Ejecuta cuando el modal se abre
		jugadorModal.addEventListener('show.bs.modal', (event) => {
			const button = event.relatedTarget;
			const modalTitle = document.getElementById('jugadorModalLabel');

			if (!button) return;

			if (button.classList.contains('btn-success')) {
				// Nuevo Jugador
				document.getElementById('jugadorForm').reset();
				document.getElementById('id').value = '';
				modalTitle.textContent = 'Nuevo Jugador';
			} else if (button.classList.contains('btn-warning')) {
				// Editar Jugador
				abrirModalEditar(button);
				modalTitle.textContent = 'Editar Jugador';
			}
		});

		function abrirModalEditar(btn) {
			const data = btn.dataset;

			document.getElementById('id').value = data.id || '';
			document.getElementById('nombre').value = data.nombre || '';
			document.getElementById('apellidos').value = data.apellidos || '';
			document.getElementById('dorsal').value = (data.dorsal !== 'null' && data.dorsal !== undefined) ? data.dorsal : '';
			document.getElementById('posicion').value = data.posicion || '';

			const equipoSelect = document.getElementById('equipo');
			if (equipoSelect && data.equipo) {
				// Recorremos todas las opciones y seleccionamos por texto
				Array.from(equipoSelect.options).forEach(option => {
					if (option.text === data.equipo) {
						option.selected = true;
					}
				});
			}
		}

		function guardarJugador(event) {
			event.preventDefault();

			const formData = new FormData(document.getElementById('jugadorForm'));
			const dorsalValue = document.getElementById('dorsal').value;
			const token = document.querySelector('input[name="_csrf"]').value;

			if (dorsalValue === "") {
				formData.delete("dorsal");
			} else {
				formData.set("dorsal", parseInt(dorsalValue, 10));
			}

			fetch('/admin/jugadores/guardar', {
				method: 'POST',
				headers: {'X-CSRF-TOKEN': token},
				body: formData
			})
				.then(response => {
					if (!response.ok) {
						return response.json().then(errorData => {
							const msg = document.getElementById('mensajeModal');
							msg.className = 'alert alert-danger';
							msg.textContent = errorData.error || 'Error desconocido';
							msg.style.display = 'block';
						});
					}
					return response.json();
				})
				.then(data => {
					if (data.mensaje) {
						const msg = document.getElementById('mensajeModal');
						msg.className = 'alert alert-success';
						msg.textContent = data.mensaje;
						msg.style.display = 'block';

						setTimeout(() => window.location.href = '/admin/jugadores', 1000);
					}
				})
				.catch(console.error);
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
