<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cuotas de temporada | Mutxamel CF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{admin/cabeceraAdmin.html}"></div>
<main class="admin-screen-shell admin-payments-page">
    <p class="dashboard-eyebrow mb-1">Administración Económica</p><h1 class="admin-screen-title">Cuotas por temporada</h1>
    <form method="get" th:action="@{/admin/pagos/conceptos}" class="payment-panel mb-4"><label class="form-label" for="temporadaId">Temporada</label><div class="d-flex gap-2"><select id="temporadaId" name="temporadaId" class="form-select" onchange="this.form.submit()"><option th:each="temporada : ${temporadas}" th:value="${temporada.id}" th:text="${temporada.nombre}" th:selected="${temporadaSeleccionada != null and temporada.id == temporadaSeleccionada.id}">Temporada</option></select></div></form>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <section class="payment-panel mb-4" th:if="${temporadaSeleccionada != null}"><h2>Crear concepto de pago</h2><form method="post" th:action="@{/admin/pagos/conceptos/guardar}" class="row g-3 align-items-end"><input type="hidden" name="temporadaId" th:value="${temporadaSeleccionada.id}"><div class="col-12 col-md-4"><label class="form-label" for="nombre">Nombre</label><input id="nombre" name="nombre" class="form-control" placeholder="Cuota mensual" required></div><div class="col-12 col-md-3"><label class="form-label" for="importe">Importe</label><div class="input-group"><input id="importe" name="importe" type="number" step="0.01" min="0" class="form-control" required><span class="input-group-text">€</span></div></div><div class="col-12 col-md-3"><label class="form-label" for="descripcion">Descripción</label><input id="descripcion" name="descripcion" class="form-control"></div><div class="col-6 col-md-1 form-check"><input id="activoNuevo" name="activo" value="1" type="checkbox" class="form-check-input" checked><label class="form-check-label" for="activoNuevo">Activo</label></div><div class="col-12 col-md-1"><button class="btn btn-primary" type="submit">Crear</button></div></form></section>
    <section class="payment-panel"><h2 th:text="${temporadaSeleccionada != null ? 'Conceptos de ' + temporadaSeleccionada.nombre : 'Selecciona una temporada'}">Conceptos</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Concepto</th><th>Descripción</th><th>Importe</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="concepto : ${conceptos}"><td colspan="5"><form method="post" th:action="@{/admin/pagos/conceptos/guardar}" class="row g-2 align-items-center"><input type="hidden" name="id" th:value="${concepto.id}"><input type="hidden" name="temporadaId" th:value="${concepto.temporadaId}"><div class="col-12 col-md-3"><input name="nombre" class="form-control form-control-sm" th:value="${concepto.nombre}" required></div><div class="col-12 col-md-3"><input name="descripcion" class="form-control form-control-sm" th:value="${concepto.descripcion}"></div><div class="col-6 col-md-2"><input name="importe" type="number" step="0.01" min="0" class="form-control form-control-sm" th:value="${concepto.importe}" required></div><div class="col-6 col-md-1"><div class="form-check"><input name="activo" value="1" type="checkbox" class="form-check-input" th:checked="${concepto.activo == 1}"><label class="form-check-label">Activo</label></div></div><div class="col-12 col-md-3 d-flex gap-2"><button class="btn btn-sm btn-primary" type="submit">Guardar</button></form><form method="post" th:action="@{/admin/pagos/conceptos/borrar}"><input type="hidden" name="id" th:value="${concepto.id}"><input type="hidden" name="temporadaId" th:value="${concepto.temporadaId}"><button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button></form></div></td></tr></tbody></table><p class="dashboard-empty" th:if="${conceptos.isEmpty()}">No hay conceptos para esta temporada.</p></div></section>
</main>
<div th:replace="~{admin/footerAdmin.html}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
