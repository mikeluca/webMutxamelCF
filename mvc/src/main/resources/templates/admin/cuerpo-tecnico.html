<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Cuerpo Técnico | Mutxamel CF</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Mostrar mensaje de error si existe -->
	<div th:if="${param.error}" style="color: red;">
		<p th:text="${param.error}"></p>
	</div>

	<!-- Incluir el header -->
	<div th:replace="~{admin/cabeceraAdmin.html}"></div>

	<main class="admin-screen-shell lead">
		<p class="dashboard-eyebrow mb-1">Administración Deportiva</p>
		<h1 class="admin-screen-title">Gestión del Cuerpo Técnico</h1>

		<div id="alertaPrincipal" class="alert" style="display:none; margin-bottom: 20px;"></div>

		<div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
			<div class="d-flex align-items-end gap-2 flex-wrap">
				<div>
					<label for="filtroTexto" class="form-label mb-1">Buscar</label>
					<input type="text" id="filtroTexto" class="form-control form-control-sm"
						placeholder="Buscar..." onkeyup="filtrarTabla()">
				</div>
				<div>
					<label for="filtroCategoria" class="form-label mb-1">Categoría</label>
					<select id="filtroCategoria" class="form-select form-select-sm" onchange="filtrarTabla()">
						<option value="">Todas</option>
						<option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria}"></option>
					</select>
				</div>
			</div>
			<button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#cuerpoTecnicoModal">
				Nuevo Cuerpo Técnico</button>
		</div>

		<!-- Tabla del cuerpo técnico -->
		<div class="admin-list-panel">
			<table class="table table-striped w-100" id="tablaCuerpoTecnico">
				<thead>
					<tr>
						<th style="width: 10%;">Deporte</th>
						<th style="width: 40%;">Nombre completo</th>
						<th style="width: 20%;">Equipo</th>
						<th style="width: 25%;">Puesto</th>
						<th style="width: 5%;"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="staff : ${cuerpoTecnico}" th:attr="data-categoria=${staff.categoria}">
						<td class="align-middle"
							th:text="${staff.deporte} == 'F' ? 'Fútbol' : (${staff.deporte} == 'FS' ? 'Fútbol Sala' : '')">
						</td>
						<td class="align-middle" th:text="${staff.nombre} + ' ' + ${staff.apellidos}"></td>
						<td class="align-middle" th:text="${staff.equipo}"></td>
						<td class="align-middle" th:text="${staff.puesto}"></td>
						<td class="align-middle">
							<div class="d-flex justify-content-center align-items-center gap-2">
								<!-- Botón Editar -->
								<button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal"
									data-bs-target="#cuerpoTecnicoModal" th:attr="data-id=${staff.id},
													                     data-nombre=${staff.nombre},
													                     data-apellidos=${staff.apellidos},
													                     data-puesto=${staff.puesto},
													                     data-equipo=${staff.equipo}" title="Editar Cuerpo Técnico"
									onclick="abrirModalEditar(this)">
									<i class="bi bi-pencil"></i>
								</button>
								<!-- Botón Borrar -->
								<button type="button" class="btn btn-danger btn-sm"
									th:attr="data-id=${staff.id}, data-nombre=${staff.nombre + ' ' + staff.apellidos}"
									onclick="borrarCuerpoTecnico(this)" title="Borrar miembro del cuerpo técnico">
									<i class="bi bi-trash"></i>
								</button>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<!-- Modal para crear/editar miembro del cuerpo técnico -->
	<div class="modal fade lead" id="cuerpoTecnicoModal" tabindex="-1" role="dialog"
		aria-labelledby="cuerpoTecnicoModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h3 class="modal-title lead" id="cuerpoTecnicoModalLabel">Nuevo cuerpo técnico</h3>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>
				<form id="cuerpoTecnicoForm" enctype="multipart/form-data" method="post">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
					<div class="modal-body">
						<!-- Mensaje de éxito/error -->
						<div id="mensajeModal" class="alert" style="display:none; margin: 10px;"></div>
						<div class="row"> <!-- Fila para las columnas -->
							<div class="col-md-6"> <!-- Primera columna -->
								<input type="hidden" id="id" name="id">
								<div class="form-group">
									<label for="nombre">Nombre:</label>
									<input type="text" class="form-control" id="nombre" name="nombre" required>
								</div>
								<div class="form-group">
									<label for="equipo">Equipo:</label>
									<select id="equipo" name="equipo" class="form-control" required>
										<option value=""></option>
										<option th:each="equipo : ${listaEquipos}" th:value="${equipo.id}"
											th:text="${equipo.nombre}"></option>
									</select>
								</div>
								<!-- Campo para subir foto -->
								<div class="form-group">
									<label for="foto">Subir Foto</label>
									<input type="file" class="form-control-file" id="foto" name="foto" accept="image/*">
									<small id="ayudaFoto" class="form-text text-muted" style="display:none;">Deja este
										campo vacío para mantener la foto actual.</small>
								</div>
							</div>
							<div class="col-md-6"> <!-- Segunda columna -->
								<div class="form-group">
									<label for="apellidos">Apellidos:</label>
									<input type="text" class="form-control" id="apellidos" name="apellidos" required>
								</div>
								<div class="form-group">
									<label for="puesto">Puesto:</label>
									<input type="text" class="form-control" id="puesto" name="puesto">
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
						<button type="submit" class="btn btn-primary" onclick="guardarCuerpoTecnico(event)">Guardar
							Cambios</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Incluir el footer -->
	<div th:replace="~{admin/footerAdmin.html}"></div>

	<script>
		const cuerpoTecnicoModal = document.getElementById('cuerpoTecnicoModal');

		// Ejecuta cuando el modal se abre
		cuerpoTecnicoModal.addEventListener('show.bs.modal', (event) => {
			const button = event.relatedTarget;
			const modalTitle = document.getElementById('cuerpoTecnicoModalLabel');

			if (!button) return;

			if (button.classList.contains('btn-success')) {
				// Nuevo Cuerpo Técnico
				document.getElementById('cuerpoTecnicoForm').reset();
				document.getElementById('id').value = '';
				document.getElementById('ayudaFoto').style.display = 'none';
				modalTitle.textContent = 'Nuevo Cuerpo Técnico';
			} else if (button.classList.contains('btn-warning')) {
				// Editar Cuerpo Técnico
				abrirModalEditar(button);
				modalTitle.textContent = 'Editar Cuerpo Técnico';
			}
		});

		function abrirModalEditar(btn) {
			const data = btn.dataset;

			document.getElementById('id').value = data.id || '';
			document.getElementById('nombre').value = data.nombre || '';
			document.getElementById('apellidos').value = data.apellidos || '';
			document.getElementById('puesto').value = data.puesto || '';
			document.getElementById('ayudaFoto').style.display = 'block';

			const equipoSelect = document.getElementById('equipo');
			if (equipoSelect && data.equipo) {
				// Recorremos todas las opciones y seleccionamos por texto
				Array.from(equipoSelect.options).forEach(option => {
					if (option.text === data.equipo) {
						option.selected = true;
					}
				});
			}
		}

		function guardarCuerpoTecnico(event) {
			event.preventDefault();

			const token = document.querySelector('input[name="_csrf"]').value;
			// Obtén los datos del formulario
			const formData = new FormData(document.getElementById('cuerpoTecnicoForm'));

			// Enviar el formulario con AJAX
			fetch('/admin/cuerpo-tecnico/guardar', {
				method: 'POST',
				headers: {
					'X-CSRF-TOKEN': token
				},
				body: formData
			})
				.then(response => {
					if (!response.ok) {
						return response.json().then(errorData => {
							document.getElementById('mensajeModal').className = 'alert alert-danger'; // Establecer clase de error
							document.getElementById('mensajeModal').textContent = errorData.error || 'Error desconocido';
							document.getElementById('mensajeModal').style.display = 'block'; // Mostrar el mensaje
						});
					}
					return response.json();
				})
				.then(data => {
					if (data.mensaje) {
						document.getElementById('mensajeModal').className = 'alert alert-success'; // Establecer clase de éxito
						document.getElementById('mensajeModal').textContent = data.mensaje;
						document.getElementById('mensajeModal').style.display = 'block'; // Mostrar el mensaje

						// Cerrar el modal después de un breve retraso
						setTimeout(() => {
							window.location.href = '/admin/cuerpo-tecnico';
						}, 1000); // Esperar 1 segundo antes de cerrar
					}
				})
				.catch(error => {
					console.error('Error:', error);
				});

		}

		function filtrarTabla() {
			const texto = document.getElementById('filtroTexto').value.toLowerCase();
			const categoria = document.getElementById('filtroCategoria').value;
			const filas = document.querySelectorAll('#tablaCuerpoTecnico tbody tr');

			filas.forEach(fila => {
				const coincideTexto = fila.textContent.toLowerCase().includes(texto);
				const coincideCategoria = !categoria || fila.dataset.categoria === categoria;
				fila.style.display = (coincideTexto && coincideCategoria) ? '' : 'none';
			});
		}

		function borrarCuerpoTecnico(btn) {
			const id = btn.dataset.id;
			const nombre = btn.dataset.nombre || 'este miembro del cuerpo técnico';
			const token = document.querySelector('input[name="_csrf"]').value;

			if (!confirm(`¿Estás seguro de que deseas borrar a ${nombre}?`)) {
				return;
			}

			fetch(`/admin/cuerpo-tecnico/borrar/${id}`, {
				method: 'POST',
				headers: { 'X-CSRF-TOKEN': token }
			})
				.then(response => response.json().then(data => ({ status: response.status, body: data })))
				.then(result => {
					const alerta = document.getElementById('alertaPrincipal');
					if (result.status === 200) {
						alerta.className = 'alert alert-success';
						alerta.textContent = result.body.mensaje;
						alerta.style.display = 'block';
						setTimeout(() => window.location.reload(), 1000);
					} else {
						alerta.className = 'alert alert-danger';
						alerta.textContent = result.body.error || 'No se ha podido borrar el miembro del cuerpo técnico.';
						alerta.style.display = 'block';
						window.scrollTo({ top: 0, behavior: 'smooth' });
					}
				})
				.catch(err => {
					console.error(err);
					alert('Error al borrar el miembro del cuerpo técnico.');
				});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
