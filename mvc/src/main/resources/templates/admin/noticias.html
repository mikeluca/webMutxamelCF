<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Noticias | Mutxamel CF</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Mostrar mensaje de error si existe -->
	<div th:if="${param.error}" style="color: red;">
		<p th:text="${param.error}"></p>
	</div>

	<!-- Incluir el header -->
	<div th:replace="~{admin/cabeceraAdmin.html}"></div>

	<main class="admin-screen-shell lead">
		<p class="dashboard-eyebrow mb-1">Contenido Web</p>
		<h1 class="admin-screen-title">Gestión de las Noticias</h1>

		<div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
			<div>
				<label for="filtroTexto" class="form-label mb-1">Buscar</label>
				<input type="text" id="filtroTexto" class="form-control form-control-sm"
					placeholder="Buscar noticia..." onkeyup="filtrarTabla()">
			</div>
			<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#noticiaModal"
				onclick="prepararNuevaNoticia()">Nueva noticia</button>
		</div>

		<!-- Tabla de noticias -->
		<div class="admin-list-panel">
			<table class="table table-striped w-100" id="tablaNoticias">
				<thead>
					<tr>
						<th style="width: 60%;">Titulo</th>
						<th style="width: 20%;">Fecha</th>
						<th style="width: 20%;"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="noticia : ${listaNoticias}">
						<td class="align-middle" th:text="${noticia.titulo}"></td>
						<td class="align-middle" th:text="${noticia.fecha}"></td>
						<td class="align-middle">
							<div class="d-flex justify-content-center align-items-center gap-2">
								<button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal"
									data-bs-target="#noticiaModal" th:attr="data-id=${noticia.id},
										                     data-titulo=${noticia.titulo},
										                     data-contenido=${noticia.contenido}" title="Editar noticia"
									onclick="abrirModalEditar(this)">
									<i class="bi bi-pencil"></i>
								</button>
								<!-- Botón para borrar noticia -->
								<form th:action="@{'/admin/noticias/borrar/' + ${noticia.id}}" method="post"
									style="display:inline;">
									<button type="submit" class="btn btn-danger btn-sm"
										onclick="return confirm('¿Estás seguro de que deseas borrar esta noticia?');"
										title="Borrar noticia">
										<i class="bi bi-trash"></i>
									</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<!-- Modal para crear/editar noticia -->
	<div class="modal fade lead" id="noticiaModal" tabindex="-1" role="dialog" aria-labelledby="noticiaModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h3 class="modal-title lead" id="noticiaModalLabel">Nueva Noticia</h3>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<form id="noticiaForm" enctype="multipart/form-data">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
					<input type="hidden" id="noticiaId" name="id">
					<div class="modal-body">
						<div id="mensajeModal" class="alert" style="display:none; margin: 10px;"></div>
						<!-- Campo para el título -->
						<div class="form-group">
							<label for="titulo">Titulo:</label>
							<input type="text" class="form-control" id="titulo" name="titulo" required>
						</div>
						<!-- Campo para el contenido con un cuadro de texto grande -->
						<div class="form-group">
							<label for="contenido">Contenido:</label>
							<textarea class="form-control" id="contenido" name="contenido" rows="10"
								required></textarea>
						</div>
						<!-- Campo para subir foto-->
						<div class="form-group">
							<label for="imagen">Imagen</label>
							<input type="file" class="form-control-file" id="imagen" name="imagen" accept="image/*">
							<small id="ayudaImagen" class="form-text text-muted" style="display:none;">Deja este campo
								vacío para mantener la imagen actual.</small>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
						<button type="submit" class="btn btn-primary" onclick="guardarNoticia(event)">Guardar
							Cambios</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Incluir el footer -->
	<div th:replace="~{admin/footerAdmin.html}"></div>

	<script>
		function guardarNoticia(event) {
			event.preventDefault();

			// Obtén los datos del formulario
			const formData = new FormData(document.getElementById('noticiaForm'));

			const token = document.querySelector('input[name="_csrf"]').value;

			// Enviar el formulario con AJAX
			fetch('/admin/noticias/guardar', {
				method: 'POST',
				headers: {
					'X-CSRF-TOKEN': token
				},
				body: formData
			})
				.then(response => {
					if (!response.ok) {
						return response.json().then(errorData => {
							document.getElementById('mensajeModal').className = 'alert alert-danger'; // Establecer clase de error
							document.getElementById('mensajeModal').textContent = errorData.error || 'Error desconocido';
							document.getElementById('mensajeModal').style.display = 'block'; // Mostrar el mensaje
						});
					}
					return response.json();
				})
				.then(data => {
					if (data.mensaje) {
						document.getElementById('mensajeModal').className = 'alert alert-success'; // Establecer clase de éxito
						document.getElementById('mensajeModal').textContent = data.mensaje;
						document.getElementById('mensajeModal').style.display = 'block'; // Mostrar el mensaje

						// Cerrar el modal después de un breve retraso
						setTimeout(() => {
							window.location.href = '/admin/noticias';
						}, 1000); // Esperar 1 segundo antes de cerrar
					}
				})
				.catch(error => {
					console.error('Error:', error);
				});
		}

		function prepararNuevaNoticia() {
			document.getElementById('noticiaId').value = '';
			document.getElementById('titulo').value = '';
			document.getElementById('contenido').value = '';
			document.getElementById('imagen').value = '';
			document.getElementById('imagen').required = false;
			document.getElementById('ayudaImagen').style.display = 'none';
			document.getElementById('noticiaModalLabel').textContent = 'Nueva Noticia';
			document.getElementById('mensajeModal').style.display = 'none';
		}

		// Revierte el contenido guardado (HTML-escapado, con <br> como salto de línea)
		// al texto plano que espera el textarea de edición.
		function decodificarContenido(contenidoGuardado) {
			const conSaltos = (contenidoGuardado || '').replace(/<br\s*\/?>/gi, '\n');
			const areaTemporal = document.createElement('textarea');
			areaTemporal.innerHTML = conSaltos;
			return areaTemporal.value;
		}

		function abrirModalEditar(btn) {
			const data = btn.dataset;
			document.getElementById('mensajeModal').style.display = 'none';
			document.getElementById('noticiaModalLabel').textContent = 'Editar Noticia';

			document.getElementById('noticiaId').value = data.id || '';
			document.getElementById('titulo').value = data.titulo || '';
			document.getElementById('contenido').value = decodificarContenido(data.contenido);
			document.getElementById('imagen').value = '';
			document.getElementById('imagen').required = false;
			document.getElementById('ayudaImagen').style.display = 'block';
		}

		function filtrarTabla() {
			const texto = document.getElementById('filtroTexto').value.toLowerCase();
			const filas = document.querySelectorAll('#tablaNoticias tbody tr');

			filas.forEach(fila => {
				fila.style.display = fila.textContent.toLowerCase().includes(texto) ? '' : 'none';
			});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
