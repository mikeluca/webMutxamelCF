<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{admin/cabeceraAdmin.html}"></div>

	<main class="container my-5 lead">
		<h1 class="page-title">Bienvenido a la sección de Administración</h1>
		<section class="admin-dashboard" aria-labelledby="resumen-club">
			<div class="dashboard-heading">
				<p class="dashboard-eyebrow">Resumen del club</p>
				<h2 id="resumen-club">Altas actuales</h2>
			</div>
			<div class="dashboard-cards">
				<a class="dashboard-card" th:href="@{/admin/cuerpo-tecnico}">
					<span class="dashboard-card-icon" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
					<span class="dashboard-card-content">
						<span class="dashboard-card-label">Entrenadores</span>
						<strong class="dashboard-card-value" th:text="${totalEntrenadores}">0</strong>
					</span>
					<i class="bi bi-arrow-up-right dashboard-card-arrow" aria-hidden="true"></i>
				</a>
				<a class="dashboard-card" th:href="@{/admin/jugadores}">
					<span class="dashboard-card-icon" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
					<span class="dashboard-card-content">
						<span class="dashboard-card-label">Jugadores</span>
						<strong class="dashboard-card-value" th:text="${totalJugadores}">0</strong>
					</span>
					<i class="bi bi-arrow-up-right dashboard-card-arrow" aria-hidden="true"></i>
				</a>
				<a class="dashboard-card" th:href="@{/admin/equipos}">
					<span class="dashboard-card-icon" aria-hidden="true"><i class="bi bi-shield-fill"></i></span>
					<span class="dashboard-card-content">
						<span class="dashboard-card-label">Equipos</span>
						<strong class="dashboard-card-value" th:text="${totalEquipos}">0</strong>
					</span>
					<i class="bi bi-arrow-up-right dashboard-card-arrow" aria-hidden="true"></i>
				</a>
			</div>
			<div class="dashboard-category-list">
				<h3>Resumen por categoría</h3>
				<div class="dashboard-summary-table-wrapper">
					<table class="dashboard-summary-table">
						<thead>
							<tr>
								<th>Categoría</th>
								<th>Equipos</th>
								<th>Jugadores</th>
								<th>Entrenadores</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="resumen : ${resumenCategorias}">
								<td th:text="${resumen.categoria}">Categoría</td>
								<td th:text="${resumen.equipos}">0</td>
								<td th:text="${resumen.jugadores}">0</td>
								<td th:text="${resumen.entrenadores}">0</td>
							</tr>
						</tbody>
					</table>
					<p class="dashboard-empty" th:if="${resumenCategorias.isEmpty()}">No hay datos registrados.</p>
				</div>
			</div>
		</section>
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{admin/footerAdmin.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
