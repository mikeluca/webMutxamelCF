<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Calendario y Resultados | Mutxamel CF</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{admin/cabeceraAdmin.html}"></div>

	<!-- Mostrar mensaje de error si existe -->
	<div th:if="${param.error}" style="color: red;">
		<p th:text="${param.error}"></p>
	</div>

	<main class="admin-screen-shell lead">
		<p class="dashboard-eyebrow mb-1">Administración Deportiva</p>
		<h1 class="admin-screen-title">Calendario / Resultados Fútbol</h1>

		<div class="d-flex justify-content-end mb-4">
			<div>
				<label for="filtroTexto" class="form-label mb-1">Buscar</label>
				<input type="text" id="filtroTexto" class="form-control form-control-sm"
					placeholder="Buscar por equipo o rival..." onkeyup="filtrarAcordeon()">
			</div>
		</div>

		<div class="admin-list-panel">
			<div class="accordion" id="acordeonEquiposFutbol">
				<div class="accordion-item equipo-acordeon-item" th:each="equipoConPartidos, iter : ${equiposFutbol}"
					th:data-filtro="${equipoConPartidos.equipo.nombre}">

					<h2 class="accordion-header" th:id="'heading-' + ${equipoConPartidos.equipo.id}">
						<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
							th:data-bs-target="'#collapse-' + ${equipoConPartidos.equipo.id}"
							aria-expanded="false"
							th:aria-controls="'collapse-' + ${equipoConPartidos.equipo.id}">
							<span th:text="${equipoConPartidos.equipo.nombre}"></span>
							<span class="badge bg-secondary ms-2" th:text="${#lists.size(equipoConPartidos.partidos)} + ' partidos'"></span>
						</button>
					</h2>

					<div th:id="'collapse-' + ${equipoConPartidos.equipo.id}" class="accordion-collapse collapse"
						th:aria-labelledby="'heading-' + ${equipoConPartidos.equipo.id}"
						data-bs-parent="#acordeonEquiposFutbol">
						<div class="accordion-body">

							<table class="table table-striped w-100">
								<thead>
									<tr>
										<th>RESULTADO</th>
										<th>RIVAL</th>
										<th>DÍA</th>
										<th>HORA</th>
										<th>CAMPO</th>
										<th></th>
										<th></th>
									</tr>
								</thead>
								<tbody>
									<!-- Aviso cuando el equipo todavía no tiene ningún partido -->
									<tr th:if="${#lists.isEmpty(equipoConPartidos.partidos)}">
										<td colspan="7" class="text-center text-muted">No tiene partido</td>
									</tr>

									<!-- Una fila por partido existente del equipo -->
									<tr th:each="partido : ${equipoConPartidos.partidos}" class="partido-fila"
										th:data-filtro="${partido.rival}">
										<form
											th:action="@{/admin/calendario-resultados/{id}/actualizar(id=${partido.id})}"
											method="post">
											<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
											<input type="hidden" name="equipoId" th:value="${equipoConPartidos.equipo.id}" />
											<td>
												<input type="text" th:value="${partido.resultado}" name="resultado" class="form-control" />
											</td>
											<td>
												<input type="text" th:value="${partido.rival}" name="rival" class="form-control" />
											</td>
											<td>
												<input type="text" th:value="${partido.diaFormateado}" name="dia" placeholder="dd/MM/yyyy" class="form-control" />
											</td>
											<td>
												<input type="text" th:value="${partido.hora}" name="hora" class="form-control" />
											</td>
											<td>
												<input type="text" th:value="${partido.campo}" name="campo" class="form-control" />
											</td>
											<td>
												<button type="submit" class="btn btn-primary">Actualizar</button>
											</td>
										</form>
										<td>
											<form
												th:action="@{/admin/calendario-resultados/{id}/eliminar(id=${partido.id})}"
												method="post"
												onsubmit="return confirm('¿Eliminar este partido?');">
												<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
												<button type="submit" class="btn btn-danger">Eliminar</button>
											</form>
										</td>
									</tr>

									<!-- Fila para añadir un partido nuevo a este equipo -->
									<tr class="table-light">
										<form th:action="@{/admin/calendario-resultados/crear}" method="post">
											<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
											<input type="hidden" name="equipoId" th:value="${equipoConPartidos.equipo.id}" />
											<td>
												<input type="text" name="resultado" class="form-control" placeholder="Resultado" />
											</td>
											<td>
												<input type="text" name="rival" class="form-control" placeholder="Rival" required />
											</td>
											<td>
												<input type="text" name="dia" class="form-control" placeholder="dd/MM/yyyy" />
											</td>
											<td>
												<input type="text" name="hora" class="form-control" placeholder="Hora" />
											</td>
											<td>
												<input type="text" name="campo" class="form-control" placeholder="Campo" />
											</td>
											<td>
												<button type="submit" class="btn btn-success">
													<i class="bi bi-plus-lg"></i> Añadir partido
												</button>
											</td>
										</form>
									</tr>
								</tbody>
							</table>

						</div>
					</div>
				</div>
			</div>
		</div>

		<!--
			Fútbol Sala: se deja preparado (misma estructura que fútbol) pero
			comentado, igual que estaba en la versión anterior de esta pantalla.

		<h1 class="admin-screen-title mt-5">Calendario / Resultados Fútbol Sala</h1>
		<div class="admin-list-panel">
			<div class="accordion" id="acordeonEquiposFutbolSala">
				<div class="accordion-item equipo-acordeon-item" th:each="equipoConPartidos, iter : ${equiposFutbolSala}"
					th:data-filtro="${equipoConPartidos.equipo.nombre}">
					... (misma estructura que arriba, sustituyendo equiposFutbol por equiposFutbolSala) ...
				</div>
			</div>
		</div>
		-->
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{admin/footerAdmin.html}"></div>

	<script>
		function filtrarAcordeon() {
			const texto = document.getElementById('filtroTexto').value.toLowerCase();

			// Filtramos los partidos dentro de cada equipo.
			document.querySelectorAll('.partido-fila').forEach(fila => {
				const valores = Array.from(fila.querySelectorAll('input'))
					.map(input => input.value.toLowerCase())
					.join(' ');
				fila.style.display = valores.includes(texto) ? '' : 'none';
			});

			// Mostramos/ocultamos cada sección de equipo según si el nombre
			// del equipo o alguno de sus partidos coincide con el texto.
			document.querySelectorAll('.equipo-acordeon-item').forEach(item => {
				const nombreEquipo = (item.getAttribute('data-filtro') || '').toLowerCase();
				const hayPartidoVisible = Array.from(item.querySelectorAll('.partido-fila'))
					.some(fila => fila.style.display !== 'none');

				item.style.display = (nombreEquipo.includes(texto) || hayPartidoVisible) ? '' : 'none';
			});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
