<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Equipos | Mutxamel CF</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{admin/cabeceraAdmin.html}"></div>

	<main class="admin-screen-shell lead">

		<p class="dashboard-eyebrow mb-1">Administración Deportiva</p>
		<h1 class="admin-screen-title">Gestión de Equipos</h1>

		<div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
			<div class="d-flex align-items-end gap-2 flex-wrap">
				<div>
					<label for="filtroTexto" class="form-label mb-1">Buscar</label>
					<input type="text" id="filtroTexto" class="form-control form-control-sm"
						placeholder="Buscar equipo..." onkeyup="filtrarTabla()">
				</div>
				<div>
					<label for="filtroCategoria" class="form-label mb-1">Categoría</label>
					<select id="filtroCategoria" class="form-select form-select-sm" onchange="filtrarTabla()">
						<option value="">Todas</option>
						<option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria}">
						</option>
					</select>
				</div>
			</div>
			<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#equipoModal"
				onclick="prepararNuevoEquipo()">Nuevo Equipo</button>
		</div>

		<!-- Tabla de equipos -->
		<div class="admin-list-panel">
			<table class="table table-striped w-100" id="tablaEquipos">
				<thead>
					<tr>
						<th style="width: 20%;">Deporte</th>
						<th style="width: 30%;">Nombre</th>
						<th style="width: 20%;">Categoría</th>
						<th style="width: 20%;">Grupo</th>
						<th style="width: 10%;"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="equipo : ${equipos}" th:attr="data-categoria=${equipo.categoria}">
						<td class="align-middle"
							th:text="${equipo.deporte} == 'F' ? 'Fútbol' : (${equipo.deporte} == 'FS' ? 'Fútbol Sala' : '')">
						</td>
						<td class="align-middle" th:text="${equipo.nombre}"></td>
						<td class="align-middle" th:text="${equipo.categoria}"></td>
						<td class="align-middle" th:text="${equipo.grupo}"></td>
						<td class="align-middle">
							<div class="d-flex justify-content-center align-items-center gap-2">
								<button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal"
									data-bs-target="#equipoModal" th:attr="data-id=${equipo.id},
										                     data-deporte=${equipo.deporte},
										                     data-categoria=${equipo.categoria},
										                     data-grupo=${equipo.grupo}" title="Editar equipo"
									onclick="abrirModalEditar(this)">
									<i class="bi bi-pencil"></i>
								</button>
								<form th:action="@{'/admin/equipos/borrar/' + ${equipo.id}}" method="post"
									style="display:inline;">
									<button type="submit" class="btn btn-danger btn-sm"
										onclick="return confirm('¿Estás seguro de que deseas borrar este equipo?');"
										title="Borrar equipo">
										<i class="bi bi-trash"></i>
									</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<!-- Modal para crear/editar equipo -->
	<div class="modal fade lead" id="equipoModal" tabindex="-1" role="dialog" aria-labelledby="equipoModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h3 class="modal-title lead" id="equipoModalLabel">Nuevo Equipo</h3>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<form id="equipoForm" enctype="multipart/form-data" onsubmit="return false;">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
					<input type="hidden" id="equipoId" name="id">
					<div class="modal-body">
						<!-- Mensaje de éxito/error -->
						<div id="mensajeModal" class="alert" style="display:none; margin: 10px;"></div>
						<div class="form-group">
							<label for="deporte">Deporte:</label>
							<select id="deporte" name="deporte" class="form-control">
								<option value="F">Fútbol</option>
								<!--								<option value="FS">Fútbol Sala</option>-->
								<!--								<option value="P">Padel</option>-->
							</select>
						</div>
						<div class="form-group">
							<label for="categoria">Categoría:</label>
							<select id="cate" name="categoria" class="form-control">
								<option th:each="categoria : ${categorias}" th:value="${categoria}"
									th:text="${categoria}"></option>
							</select>
						</div>
						<div class="form-group">
							<label for="grupo">Grupo:</label>
							<select id="grupo" name="grupo" class="form-control">
								<option value="A">A</option>
								<option value="B">B</option>
								<option value="C">C</option>
								<option value="D">D</option>
								<option value="Fem">Fem</option>
								<!--								<option value="FS">FS</option>-->
								<option value="Esc">Escuelita</option>
							</select>
						</div>
						<div class="form-group">
							<label for="nombre">Nombre:</label>
							<input type="text" class="form-control" id="nombre" name="nombre" readonly>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
						<button type="submit" class="btn btn-primary" onclick="guardarEquipo()">Guardar Cambios</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Incluir el footer -->
	<div th:replace="~{admin/footerAdmin.html}"></div>

	<script>
		function guardarEquipo() {
			// Obtén los datos del formulario
			const formData = new FormData(document.getElementById('equipoForm'));

			// Enviar el formulario con AJAX
			fetch('/admin/equipos/guardar', {
				method: 'POST',
				body: formData
			})
				.then(response => {
					if (!response.ok) {
						return response.json().then(errorData => {
							document.getElementById('mensajeModal').className = 'alert alert-danger'; // Establecer clase de error
							document.getElementById('mensajeModal').textContent = errorData.error || 'Error desconocido';
							document.getElementById('mensajeModal').style.display = 'block'; // Mostrar el mensaje
						});
					}
					return response.json();
				})
				.then(data => {
					if (data.mensaje) {
						document.getElementById('mensajeModal').className = 'alert alert-success'; // Establecer clase de éxito
						document.getElementById('mensajeModal').textContent = data.mensaje;
						document.getElementById('mensajeModal').style.display = 'block'; // Mostrar el mensaje

						// Cerrar el modal después de un breve retraso
						setTimeout(() => {
							window.location.href = '/admin/equipos';
						}, 1000); // Esperar 1 segundo antes de cerrar
					}
				})
				.catch(error => {
					console.error('Error:', error);
				});
		}

		function prepararNuevoEquipo() {
			document.getElementById('equipoId').value = '';
			document.getElementById('cate').value = '';
			document.getElementById('nombre').value = '';
			document.getElementById('grupo').value = '';
			document.getElementById('deporte').value = '';
			document.getElementById('equipoModalLabel').textContent = 'Nuevo Equipo';
			document.getElementById('mensajeModal').style.display = 'none'; // Limpiar mensaje
		}

		function abrirModalEditar(btn) {
			const data = btn.dataset;
			document.getElementById('mensajeModal').style.display = 'none';
			document.getElementById('equipoModalLabel').textContent = 'Editar Equipo';

			document.getElementById('equipoId').value = data.id || '';
			document.getElementById('deporte').value = data.deporte || '';
			document.getElementById('cate').value = data.categoria || '';
			document.getElementById('grupo').value = data.grupo || '';
			actualizarNombre();
		}

		// Función para actualizar el campo "nombre"
		function actualizarNombre() {
			const categoria = document.getElementById('cate').value;
			const grupo = document.getElementById('grupo').value;
			document.getElementById('nombre').value = categoria + ' ' + grupo;
		}

		document.getElementById('cate').addEventListener('change', actualizarNombre);
		document.getElementById('grupo').addEventListener('change', actualizarNombre);

		function filtrarTabla() {
			const texto = document.getElementById('filtroTexto').value.toLowerCase();
			const categoria = document.getElementById('filtroCategoria').value;
			const filas = document.querySelectorAll('#tablaEquipos tbody tr');

			filas.forEach(fila => {
				const coincideTexto = fila.textContent.toLowerCase().includes(texto);
				const coincideCategoria = !categoria || fila.dataset.categoria === categoria;
				fila.style.display = (coincideTexto && coincideCategoria) ? '' : 'none';
			});
		}
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
