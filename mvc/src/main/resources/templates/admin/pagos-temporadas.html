<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Temporadas | Mutxamel CF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{admin/cabeceraAdmin.html}"></div>
<main class="admin-screen-shell admin-payments-page">
    <p class="dashboard-eyebrow mb-1">Administración Económica</p><h1 class="admin-screen-title">Temporadas</h1>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <section class="payment-panel mb-4">
        <h2>Crear temporada</h2>
        <form method="post" th:action="@{/admin/pagos/temporadas/guardar}" class="row g-3 align-items-end">
            <div class="col-12 col-md-4"><label class="form-label" for="nombre">Nombre</label><input id="nombre" name="nombre" class="form-control" placeholder="2026/2027" required></div>
            <div class="col-6 col-md-2"><label class="form-label" for="fechaInicio">Inicio</label><input id="fechaInicio" name="fechaInicio" type="date" class="form-control" required></div>
            <div class="col-6 col-md-2"><label class="form-label" for="fechaFin">Fin</label><input id="fechaFin" name="fechaFin" type="date" class="form-control"></div>
            <div class="col-12 col-md-2 form-check ms-2"><input id="activa" name="activa" value="1" type="checkbox" class="form-check-input"><label class="form-check-label" for="activa">Activa</label></div>
            <div class="col-12 col-md-1"><button class="btn btn-primary" type="submit">Crear</button></div>
        </form>
    </section>
    <section class="payment-panel"><h2>Temporadas registradas</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Nombre</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="temporada : ${temporadas}"><td colspan="5"><form method="post" th:action="@{/admin/pagos/temporadas/guardar}" class="row g-2 align-items-center"><input type="hidden" name="id" th:value="${temporada.id}"><div class="col-12 col-md-3"><input name="nombre" class="form-control form-control-sm" th:value="${temporada.nombre}" required></div><div class="col-6 col-md-2"><input name="fechaInicio" type="date" class="form-control form-control-sm" th:value="${#dates.format(temporada.fechaInicio, 'yyyy-MM-dd')}" required></div><div class="col-6 col-md-2"><input name="fechaFin" type="date" class="form-control form-control-sm" th:value="${temporada.fechaFin != null ? #dates.format(temporada.fechaFin, 'yyyy-MM-dd') : ''}"></div><div class="col-6 col-md-2"><div class="form-check"><input name="activa" value="1" type="checkbox" class="form-check-input" th:checked="${temporada.activa == 1}"><label class="form-check-label">Activa</label></div></div><div class="col-6 col-md-3 d-flex gap-2"><button class="btn btn-sm btn-primary" type="submit">Guardar</button></form><form method="post" th:action="@{/admin/pagos/temporadas/borrar}"><input type="hidden" name="id" th:value="${temporada.id}"><button class="btn btn-sm btn-danger" type="submit">Borrar</button></form></div></td></tr></tbody></table><p class="dashboard-empty" th:if="${temporadas.isEmpty()}">No hay temporadas registradas.</p></div></section>
</main>
<div th:replace="~{admin/footerAdmin.html}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
