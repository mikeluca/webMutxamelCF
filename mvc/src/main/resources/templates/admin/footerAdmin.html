<script>
	document.querySelectorAll('form[action*="/admin/pagos/"][action*="borrar"]:not([action*="borrar-ajax"]):not([action*="/cuotas/"])').forEach(function (form) {
		form.addEventListener('submit', function (event) {
			if (!window.confirm('¿Estás seguro de que deseas borrar este registro?')) {
				event.preventDefault();
			}
		});
	});
</script>
