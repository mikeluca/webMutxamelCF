<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container-fluid my-5">
		<h1 class="page-title">Jugadores - <span th:text="${categoria}"></span></h1>
		<div class="personas-grid">
			<div class="card h-100" th:each="jugador : ${jugadores}">

				<div th:if="${jugador.fotoBase64 != null}">
					<img th:src="'data:image/jpeg;base64,' + ${jugador.fotoBase64}" class="card-img-top persona-img"
						alt="Imagen de Noticia" />
				</div>
				<div th:if="${jugador.fotoBase64 == null}">
					<img th:src="@{/images/man.png}" class="card-img-top persona-img" alt="Imagen Noticia">
				</div>
				<div class="card-body">
					<h2 class="card-title" th:text="${jugador.nombre} + ' ' + ${jugador.apellidos}"></h2>
					<p class="card-text lead">
						<span th:text="${jugador.dorsal}"></span> - <span th:text="${jugador.posicion}"></span>
					</p>
				</div>
			</div>
		</div>

		<h2 class="section-title">Cuerpo Técnico</h2>
		<div class="personas-grid">
			<div class="card h-100" th:each="staff : ${staff}">

				<div th:if="${staff.fotoBase64 != null}">
					<img th:src="'data:image/jpeg;base64,' + ${staff.fotoBase64}" class="card-img-top persona-img"
						alt="Imagen de Noticia" />
				</div>
				<div th:if="${staff.fotoBase64 == null}">
					<img th:src="@{/images/office-man.png}" class="card-img-top persona-img" alt="Imagen Noticia">
				</div>
				<div class="card-body">
					<h3 class="card-title" th:text="${staff.nombre} + ' ' + ${staff.apellidos}"></h3>
					<p class="card-text" th:text="${staff.puesto}"></p>
				</div>
			</div>
		</div>
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
