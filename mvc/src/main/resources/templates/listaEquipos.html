<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<style>
	.category-header {
		background-color: #007bff;
		padding: 10px;
		margin-top: 20px;
	}

	/* Estilos de la cuadrícula de tarjetas */
	.team-grid {
		display: grid;
		grid-template-columns: repeat(3, 1fr);
		/* Tres columnas iguales */
		gap: 15px;
		/* Espacio entre tarjetas */
		margin: 20px 0px;
	}

	.team-card {
		border: 1px solid #ddd;
		border-radius: 8px;
		padding: 15px;
		background-color: #f8f9fa;
		text-align: center;
		box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
	}

	.team-card h5 {
		font-size: 1.25em;
		margin-bottom: 10px;
		color: black;
	}

	.team-card img.team-img {
		width: 100%;
		height: 150px;
		object-fit: cover;
		border-radius: 10px;
		margin-bottom: 10px;
	}
</style>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main>

		<div class="container-fluid">
			<h1 class="text-center my-5 fw-bold">Lista de Equipos</h1>

			<!-- Agrupación de equipos por categoría -->
			<div th:each="entry : ${equiposPorCategoria}">
				<div class="category-header">
				</div>

				<!-- Cuadrícula de tarjetas -->
				<div class="team-grid">
					<!-- Tarjeta para cada equipo -->
					<div th:each="equipo : ${entry.value}" class="team-card">
						<a th:href="@{/categorias/{nombre}(nombre=${equipo.nombre})}" style="text-decoration: none;">
							<img src="/images/silueta_equipo.jpg" alt="Imagen de equipo" class="team-img">
							<h5 th:text="${equipo.nombre}">Nombre del Equipo</h5>
						</a>
					</div>
				</div>
			</div>
		</div>

	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
