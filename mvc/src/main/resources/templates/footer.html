<!-- Bloque de patrocinadores -->
<div class="container mt-4">
	<h5 class="fw-bold text-center">Nuestros Patrocinadores</h5>
	<div class="row justify-content-center">
		<div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3" th:each="patrocinador : ${patrocinadores}">
			<img th:src="@{'/images/' + ${patrocinador}}" class="patrocinador-img img-fluid" alt="Patrocinador">
		</div>
	</div>
</div>
<footer class="bg-dark text-white text-center py-3">
	<p>Mutxamel CF © Todos los derechos reservados. <a th:href="@{/politicaPrivacidad}" class="no-style">Política de
			Privacidad.</a></p>

	<button class="btn btn-primary" onclick="redirectToLogin()">Iniciar Sesión</button>

	<script>
		function redirectToLogin() {
			window.location.href = "/login";
		}
	</script>

</footer>
