<div class="container mt-2">
	<h1 class="fw-bold text-center" th:text="#{footer.patrocinadores.titulo}">Nuestros Patrocinadores</h1>
	<p class="text-center text-muted small mb-3">
	    <i class="bi bi-box-arrow-up-right"></i>
	    <span th:text="#{footer.patrocinadores.subtitulo}">Pulsa en las imagenes para conocer mas acerca de nuestros patrocinadores.</span>
	</p>
	<div class="row justify-content-center">

		<!-- Lista unica: PatrocinadoresClub (modulo service, paquete model). Alli se anaden, quitan o reordenan los patrocinadores. -->
		<div class="col-7 col-sm-4 col-md-3 col-lg mb-3" th:each="patrocinador : ${patrocinadoresFooter}">
			<a th:if="${patrocinador.url != null}" th:href="${patrocinador.url}" target="_blank" rel="noopener">
				<img th:src="${patrocinador.imagenUrl}" class="patrocinador-img img-fluid" th:alt="${patrocinador.nombre}"
					th:style="${patrocinador.circular} ? 'width:150px; height:auto; aspect-ratio:1/1; object-fit:cover; border-radius:50%;'">
			</a>
			<img th:if="${patrocinador.url == null}" th:src="${patrocinador.imagenUrl}" class="patrocinador-img img-fluid"
				th:alt="${patrocinador.nombre}"
				th:style="${patrocinador.circular} ? 'width:150px; height:auto; aspect-ratio:1/1; object-fit:cover; border-radius:50%;'">
		</div>

	</div>
</div>

<footer class="bg-dark text-white text-center py-3">
	<p><span th:text="#{footer.copyright}">Mutxamel C.F. © Todos los derechos reservados.</span> <a th:href="@{/politicaPrivacidad}" class="no-style" th:text="#{footer.politicaPrivacidad}">Política de
			Privacidad.</a></p>

	<script>
		function redirectToLogin() {
			window.location.href = "/login";
		}
	</script>

</footer>
