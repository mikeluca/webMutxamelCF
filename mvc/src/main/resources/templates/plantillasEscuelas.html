<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container-fluid my-5 lead">
		<h1 class="page-title"><span th:text="#{plantilla.jugadoresDe}">Jugadores -</span> <span th:text="${categoria}"></span></h1>
		<div class="personas-grid">
			<div th:if="${equipoEscuelita.fotoBase64 != null}" class="text-center">
				<img th:src="'data:image/jpeg;base64,' + ${equipoEscuelita.fotoBase64}" class="card-img-top"
					alt="Imagen del equipo" style="width: 100%; max-width: 500px; height: auto; margin: 0 auto;" />
			</div>
			<div th:if="${equipoEscuelita.fotoBase64 == null}" class="text-center">
				<img th:src="@{/images/silueta_equipo.jpg}" class="card-img-top" alt="Imagen por defecto"
					style="width: 100%; max-width: 500px; height: auto; margin: 0 auto;" />
			</div>
		</div>
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>

</html>
