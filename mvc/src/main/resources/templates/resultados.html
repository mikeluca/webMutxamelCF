<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

	<style>
		.categoria-seccion { margin-top: 2rem; }
		.categoria-titulo { margin-bottom: 0.75rem; font-weight: bold; }
		/* Mismo reparto de columnas en todas las categorías */
		.tabla-resultados { table-layout: fixed; width: 100%; }
		.tabla-resultados td, .tabla-resultados th { overflow-wrap: anywhere; }
		.tipo-liga { border-left: 4px solid #0d6efd; }
		.tipo-amistoso { border-left: 4px solid #6c757d; }
		.tipo-copa { border-left: 4px solid #ffc107; }
		.tipo-torneo { border-left: 4px solid #6f42c1; }
		.tipo-badge {
			display: inline-block;
			padding: 0.2em 0.6em;
			border-radius: 0.75rem;
			font-size: 0.75rem;
			font-weight: bold;
			color: #fff;
		}
		.tipo-badge-liga { background-color: #0d6efd; }
		.tipo-badge-amistoso { background-color: #6c757d; }
		.tipo-badge-copa { background-color: #ffc107; color: #212529; }
		.tipo-badge-torneo { background-color: #6f42c1; }
	</style>
</head>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container-fluid">
		<div>
			<h1 class="page-title" th:text="#{resultados.titulo}">Calendario / Resultados Fútbol</h1>

			<!-- Una seccion con su propia tabla por cada categoria, ya agrupadas y ordenadas por MainController -->
			<div th:each="entrada : ${resultadosPorCategoria}" class="categoria-seccion">
				<h2 class="categoria-titulo" th:text="${entrada.key}"></h2>
				<div class="table-responsive">
					<table class="tabla-resultados">
						<colgroup>
							<col style="width: 7%;"><col style="width: 16%;"><col style="width: 10%;"><col style="width: 24%;">
							<col style="width: 9%;"><col style="width: 7%;"><col style="width: 27%;">
						</colgroup>
						<thead>
							<tr>
								<th th:text="#{resultados.col.tipo}">TIPO</th>
								<th th:text="#{resultados.col.equipo}">EQUIPO</th>
								<th th:text="#{resultados.col.resultado}">RESULTADO</th>
								<th th:text="#{resultados.col.rival}">RIVAL</th>
								<th th:text="#{resultados.col.dia}">DIA</th>
								<th th:text="#{resultados.col.hora}">HORA</th>
								<th th:text="#{resultados.col.campo}">CAMPO</th>
							</tr>
						</thead>
						<tbody>
							<!-- Iteramos sobre los resultados de esta categoria -->
							<tr th:each="resultado : ${entrada.value}"
								th:classappend="${resultado.tipo != null ? 'tipo-' + #strings.toLowerCase(resultado.tipo) : ''}">
								<td>
									<span th:if="${resultado.tipo != null}" th:text="${resultado.tipo}" th:class="${'tipo-badge tipo-badge-' + #strings.toLowerCase(resultado.tipo)}"></span>
								</td>
								<td th:text="${resultado.equipo}"></td>
								<!-- Equipo sin proximo partido ni ultimo resultado: fila "placeholder" -->
								<!-- Equipo que descansa este fin de semana (importador FFCV) -->
								<td th:if="${resultado.descansa}" colspan="5" class="text-center text-muted" th:text="#{resultados.descansa}">Descansa</td>
								<td th:if="${!resultado.descansa and (resultado.rival == null or #strings.isEmpty(resultado.rival))}" colspan="5" class="text-center text-muted" th:text="#{resultados.sinPartido}">No tiene partido</td>
								<th:block th:unless="${resultado.descansa or resultado.rival == null or #strings.isEmpty(resultado.rival)}">
									<td th:text="${resultado.resultado}"></td>
									<td th:text="${resultado.rival}"></td>
									<td th:text="${#dates.format(resultado.dia, 'dd/MM/yyyy')}"></td>
									<td th:text="${resultado.hora}"></td>
									<td th:text="${resultado.campo}"></td>
								</th:block>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<!--						<td th:text="${#dates.format(resultado.dia, 'dd/MM/yyyy')}"></td>-->
		<!--						<td th:text="${resultado.hora}"></td>-->
		<!--						<td th:text="${resultado.campo}"></td>-->
		<!--					</tr>-->

	</main>
