	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
	<style>
		.categoria-header td {
			font-weight: bold;
			background-color: #f1f1f1;
			padding-top: 1rem;
		}
		.tipo-liga { border-left: 4px solid #0d6efd; }
		.tipo-amistoso { border-left: 4px solid #6c757d; }
		.tipo-copa { border-left: 4px solid #ffc107; }
		.tipo-torneo { border-left: 4px solid #6f42c1; }
		.tipo-badge {
			display: inline-block;
			padding: 0.2em 0.6em;
			border-radius: 0.75rem;
			font-size: 0.75rem;
			font-weight: bold;
			color: #fff;
		}
		.tipo-badge-liga { background-color: #0d6efd; }
		.tipo-badge-amistoso { background-color: #6c757d; }
		.tipo-badge-copa { background-color: #ffc107; color: #212529; }
		.tipo-badge-torneo { background-color: #6f42c1; }
	</style>
</head>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container-fluid">
		<!-- Mostramos los resultadosFutbol en una tabla si existen -->
		<div>
			<h1 class="page-title">Calendario / Resultados Fútbol</h1>
			<div class="table-responsive">
			<table>
				<thead>
					<tr>
						<th>EQUIPO</th>
						<th>TIPO</th>
						<th>RESULTADO</th>
						<th>RIVAL</th>
						<th>DIA</th>
						<th>HORA</th>
						<th>CAMPO</th>
					</tr>
				</thead>
				<tbody>
					<th:block th:each="resultado, iterStat : ${resultadosFutbol}">
						<tr th:if="${iterStat.index == 0 or resultado.categoria != resultadosFutbol[iterStat.index - 1].categoria}" class="categoria-header">
							<td colspan="7" th:text="${resultado.categoria}"></td>
						</tr>
						<tr th:classappend="${resultado.tipo != null ? 'tipo-' + #strings.toLowerCase(resultado.tipo) : ''}">
							<td th:text="${resultado.equipo}" style="width: auto;"></td>
							<td>
								<span th:if="${resultado.tipo != null}" th:text="${resultado.tipo}" th:class="${'tipo-badge tipo-badge-' + #strings.toLowerCase(resultado.tipo)}"></span>
							</td>
							<!-- Equipo sin proximo partido ni ultimo resultado: fila "placeholder" -->
							<td th:if="${resultado.rival == null or #strings.isEmpty(resultado.rival)}" colspan="5" class="text-center text-muted">No tiene partido</td>
							<th:block th:unless="${resultado.rival == null or #strings.isEmpty(resultado.rival)}">
								<td th:text="${resultado.resultado}" style="width: 80px;"></td>
								<td th:text="${resultado.rival}" style="width: auto;"></td>
								<td th:text="${#dates.format(resultado.dia, 'dd/MM/yyyy')}" style="width: 80px; "></td>
								<td th:text="${resultado.hora}" style="width: 80px;"></td>
								<td th:text="${resultado.campo}" style="width: auto;"></td>
							</th:block>
						</tr>
					</th:block>
				</tbody>
			</table>
			</div>
		</div>
