<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<!-- Mostrar mensaje de error si existe -->
	<div th:if="${param.error}" style="color: red;">
		<p th:text="${param.error}"></p>
	</div>

	<main class="container-fluid my-5 lead">
		<h1 class="page-title" th:text="#{index.ultimasNoticias}">Últimas Noticias</h1>
		<div class="noticias-grid">
			<div class="card h-100" th:each="noticia : ${noticias}">

				<div th:if="${noticia.imagenBase64 != null}">
					<img th:src="'data:image/jpeg;base64,' + ${noticia.imagenBase64}" class="card-img-top noticia-img"
						alt="Imagen de Noticia" />
				</div>
				<div th:if="${noticia.imagenBase64 == null}">
					<img th:src="@{/images/noticia3.jpg}" class="card-img-top noticia-img" alt="Imagen Noticia">
				</div>

				<div class="card-body">
					<h2 class="card-title text-center" th:utext="${noticia.titulo}"></h2>
					<p class="text-center text-muted mb-2" th:text="${#dates.format(noticia.fecha,'dd/MM/yyyy')}"
						style="font-size: 0.9rem;"></p>
					</p>
					<p class="card-text" th:utext="${#strings.abbreviate(noticia.contenido, 100)}"></p>
					<a th:href="@{/ampliarNoticia/{id}(id=${noticia.id})}" class="btn btn-primary" th:text="#{common.leerMas}">Leer más</a>
				</div>
			</div>
		</div>

		<!-- Botón para ver todas las noticias -->
		<div class="text-center mt-4">
			<a href="/todasNoticias" class="btn btn-outline-primary btn-lg" th:text="#{index.masNoticias}">+ Noticias</a>
		</div>

		<!--		<h2 class="text-center m-5 fw-bold">Nuestros Patrocinadores</h2>-->
		<!--		<div class="row">-->
		<!--			<div class="col-6 col-sm-4 col-md-4 col-lg-2 mb-4" th:each="patrocinador : ${patrocinadores}">-->
		<!--				<div class="text-center">-->
		<!--					<img th:src="@{'/images/' + ${patrocinador}}" class="patrocinador-img" alt="Patrocinador"-->
		<!--						width="100%">-->
		<!--				</div>-->
		<!--			</div>-->
		<!--		</div>-->
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
