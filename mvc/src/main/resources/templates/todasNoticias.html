<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K1DNQTT2X3"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() {dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-K1DNQTT2X3');
</script>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container-fluid my-5 lead">
		<h1 class="page-title" th:text="#{todasNoticias.titulo}">Todas las noticias</h1>
		<div class="row g-4">
			<div class="col-6 col-md-4 col-lg-3" th:each="noticia : ${noticias}">
				<div class="card noticia-card">
					<div th:if="${noticia.imagenBase64 != null}">
						<img th:src="'data:image/jpeg;base64,' + ${noticia.imagenBase64}"
							class="card-img-top noticia-img" alt="Imagen de Noticia" />
					</div>
					<div th:if="${noticia.imagenBase64 == null}">
						<img th:src="@{/images/noticia3.jpg}" class="card-img-top noticia-img" alt="Imagen Noticia">
					</div>

					<div class="card-body">
						<h5 class="card-title" th:text="${noticia.titulo}"></h5>
						<p class="text-center text-muted mb-2" th:text="${#dates.format(noticia.fecha,'dd/MM/yyyy')}"
							style="font-size: 0.9rem;"></p>
						<p class="card-text" th:utext="${#strings.abbreviate(noticia.contenido, 80)}"></p>
						<a th:href="@{/ampliarNoticia/{id}(id=${noticia.id})}" class="btn btn-sm btn-primary" th:text="#{common.leerMas}">Leer
							más</a>
					</div>
				</div>
			</div>
			<!-- Botón volver al inicio -->
			<div class="text-center mt-5">
				<a th:href="@{/index}" class="btn btn-secondary btn-lg" th:text="#{todasNoticias.volverInicio}">Volver al inicio</a>
			</div>
		</div>
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>

</html>
