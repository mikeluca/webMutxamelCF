<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mutxamel Club de Fútbol</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
	<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
</head>

<body>

	<!-- Incluir el header -->
	<div th:replace="~{cabecera.html}"></div>

	<main class="container my-5 lead">
		<div class="row g-4">
			<div class="col-6 col-md-4 col-lg-3" th:each="noticia : ${noticias}">
				<div class="card noticia-card">
					<div th:if="${noticia.imagenBase64 != null}">
						<img th:src="'data:image/jpeg;base64,' + ${noticia.imagenBase64}"
							class="card-img-top noticia-img" alt="Imagen de Noticia" />
					</div>
					<div th:if="${noticia.imagenBase64 == null}">
						<img th:src="@{/images/noticia3.jpg}" class="card-img-top noticia-img" alt="Imagen Noticia">
					</div>

					<div class="card-body">
						<h5 class="card-title" th:text="${noticia.titulo}"></h5>
						<p class="card-text" th:utext="${#strings.abbreviate(noticia.contenido, 80)}"></p>
						<a th:href="@{/ampliarNoticia/{id}(id=${noticia.id})}" class="btn btn-sm btn-primary">Leer
							más</a>
					</div>
				</div>
			</div>
			<!-- Botón volver al inicio -->
			<div class="text-center mt-5">
				<a th:href="@{/index}" class="btn btn-secondary btn-lg">Volver al inicio</a>
			</div>
		</div>
	</main>

	<!-- Incluir el footer -->
	<div th:replace="~{footer.html}"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
