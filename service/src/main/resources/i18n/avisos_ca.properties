equipaje.principal=Equipació: {equipacion}.
equipaje.mochila=A la motxilla: {equipacion}.
equipaje.ninguno=Ja no hi ha cap equipació indicada.
lista.y=i
directo.sinGoleadores=Sense golejadors
directo.golSinAutor=Gol del Mutxamel CF
directo.golPropiaPuerta=Gol en pròpia porta del rival

