convocatoria.anulada.familia=S'ha anul·lat la convocatòria de {jugador} per al partit contra {rival} del {fecha}.

convocatoria.quitadosAusencia.titulo=Llevats per absència justificada
convocatoria.quitadosAusencia.texto=S'han llevat de la convocatòria del partit contra {rival} perquè tenen l'absència justificada: {nombres}.

# ---------- 2. Absències a partits (entrenador) ----------
ausencia.justificada.titulo=Absència justificada
ausencia.justificada.texto={jugador} no podrà jugar el partit contra {rival} del {fecha}.
ausencia.convocado.titulo=Absència d'un convocat
ausencia.convocado.texto={jugador} està en la convocatòria i no podrà jugar el partit contra {rival} del {fecha}. Edita la convocatòria per a posar un altre jugador en el seu lloc.
ausencia.quitado.titulo=Baixa en la convocatòria
ausencia.quitado.texto={jugador} no podrà jugar el partit contra {rival} del {fecha} i s'ha llevat de la convocatòria: no queden més jugadors disponibles.
ausencia.retirada.titulo=Absència retirada
ausencia.retirada.texto={jugador} ja pot jugar el partit contra {rival} del {fecha}. No s'ha afegit a la convocatòria: si comptes amb {jugador}, edita-la.

# ---------- 3. Convidats d'altres equips ----------
invitacion.pendiente.titulo=Invitació pendent d'aprovar
invitacion.pendiente.texto={destino} vol convocar {jugador} ({origen}) per al partit contra {rival} del {fecha}.
invitacion.pendiente.push={destino} vol convocar un jugador de {origen} el {fecha}. Revisa-ho en Invitacions.
invitacion.rechazada.titulo=Invitació rebutjada
invitacion.rechazada.texto=La coordinació no ha aprovat que {jugador} jugue amb {equipo} el partit contra {rival} del {fecha}. Pots convocar un altre jugador.
invitacion.liberar.titulo=Allibera un jugador per a un altre equip
invitacion.liberar.texto={destino} ha convidat {jugador} al partit contra {rival} del {fecha}, i eixe dia {jugador} està en la teua convocatòria de {origen}. Si pot jugar amb {destino}, lleva {jugador} de la teua convocatòria.
invitacion.liberar.push={destino} ha convidat {jugador} el {fecha}, el mateix dia que el teu partit. Si pot jugar amb ells, lleva {jugador} de la teua convocatòria.
invitacion.plazo.titulo=Invitació sense alliberar
invitacion.plazo.texto=Fa més de 12 hores que es va demanar a {origen} que alliberara {jugador} per a jugar amb {destino} el {fecha}, i encara no hi ha resposta. Pots fer-ho tu des d'Invitacions.
invitacion.plazo.push=Una invitació porta més de 12 hores esperant que alliberen {jugador}.
invitacion.convocado.titulo=Convocatòria amb un altre equip
invitacion.convocado.jugador=T'han convocat amb {destino} per al partit contra {rival} del {fecha} a les {hora}.\n\nCitació: {horaCitacion} a {lugar}.
invitacion.convocado.familia=Han convocat {jugador} amb {destino} per al partit contra {rival} del {fecha} a les {hora}.\n\nCitació: {horaCitacion} a {lugar}.
invitacion.autorizadaOrigen.titulo=Jugador amb un altre equip
invitacion.autorizadaOrigen.texto={jugador} jugarà amb {destino} el partit contra {rival} del {fecha}.
invitacion.informativa.titulo=Jugador amb un altre equip el dia del teu partit
invitacion.informativa.texto={jugador} jugarà amb {destino} el partit contra {rival} del {fecha}. Eixe dia {origen} també juga i {jugador} no estava en la teua convocatòria: eixe dia ja no podràs convocar {jugador}.
invitacion.liberadaCoordinacion.titulo=La coordinació ha alliberat un jugador
invitacion.liberadaCoordinacion.texto=La coordinació ha llevat {jugador} de la teua convocatòria perquè jugue amb {destino} el {fecha}.
invitacion.liberado.titulo=Juga amb un altre equip
invitacion.liberado.jugador=Ja no estàs en la convocatòria de {origen} per al partit contra {rival} del {fecha}: eixe dia jugues amb {destino}.
invitacion.liberado.familia={jugador} ja no està en la convocatòria de {origen} per al partit contra {rival} del {fecha}: eixe dia juga amb {destino}.
invitacion.anulada.quitado.titulo=Fora de la convocatòria
invitacion.anulada.borrada.titulo=Convocatòria anul·lada
invitacion.anulada.cancelado.titulo=Partit cancel·lat
