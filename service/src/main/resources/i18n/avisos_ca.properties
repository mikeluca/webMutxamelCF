cambio.hora=nova hora de citació, {hora}
cambio.lugar=nou lloc de citació, {lugar}
cambio.partido=el partit passa al {fecha} a les {hora}
cambio.equipaje=canvia l'equipació

convocatoria.quitado.titulo=Fora de la convocatòria
convocatoria.quitado.jugador=Ja no estàs en la convocatòria del partit contra {rival} del {fecha}.
convocatoria.quitado.familia={jugador} ja no està en la convocatòria del partit contra {rival} del {fecha}.

convocatoria.anulada.titulo=Convocatòria anul·lada
