invitacion.aplazadas.titulo=Partit ajornat: invitacions anul·lades
invitacion.aplazadas.texto=El partit de {destino} contra {rival} passa del {fechaAntigua} al {fechaNueva}. S'han anul·lat les invitacions de {nombres}: si vols, torna a convidar-los per a la nova data.
invitacion.aplazadas.push=El partit contra {rival} passa al {fechaNueva}: s'han anul·lat les teues invitacions a jugadors d'altres equips.
invitacion.enEspera.titulo=Convocatòria amb un altre equip en espera
invitacion.enEspera.jugador=La teua convocatòria amb {destino} del {fecha} queda en espera: {origen} ha mogut un partit a eixe dia i el teu entrenador ha de donar-te permís.
