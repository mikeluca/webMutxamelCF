# Textos dels avisos automàtics (safata, push i correus). Valencià.
# Codificació UTF-8. Marcadors amb nom entre claus: {jugador}, {rival}... (no és MessageFormat: els apòstrofs van tal qual).
# {fecha} = dia de la setmana + d/M ("dissabte 25/10"); {fechaCompleta} = d/M/aaaa; {hora} = HH:mm.

# ---------- Peces comunes ----------
motivo=Motiu: {motivo}
