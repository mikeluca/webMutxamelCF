# Textos de los avisos automáticos (bandeja, push y emails). Castellano.
# Codificación UTF-8. Marcadores con nombre entre llaves: {jugador}, {rival}... (no es MessageFormat: los apóstrofos van tal cual).
# {fecha} = día de la semana + d/M ("sábado 25/10"); {fechaCompleta} = d/M/aaaa; {hora} = HH:mm.
# Las claves *.push son el texto del push cuando es distinto del de la bandeja. "motivo" se añade como párrafo aparte SOLO en la bandeja.

# ---------- Piezas comunes ----------
motivo=Motivo: {motivo}
ducha=🚿 Recomendamos que los jugadores se duchen después del partido.
equipaje.principal=Jugaremos con el equipaje {equipacion}.
equipaje.mochila=Y nos llevamos en la mochila el {equipacion}, por si hiciera falta.
equipaje.ninguno=No hay equipaje indicado.
lista.y=y
directo.sinGoleadores=Sin goleadores
directo.golSinAutor=Goool del Mutxamel CF
directo.golPropiaPuerta=Gol en propia puerta del rival

# ---------- 1. Convocatorias (jugador y familia) ----------
