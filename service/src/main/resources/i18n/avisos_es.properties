convocatoria.anulada.titulo=Convocatoria anulada
convocatoria.anulada.jugador=Se ha anulado la convocatoria del partido contra el {rival} del {fecha}.
convocatoria.anulada.familia=Se ha anulado la convocatoria de {jugador} para el partido contra el {rival} del {fecha}.

convocatoria.quitadosAusencia.titulo=Quitados por ausencia justificada
convocatoria.quitadosAusencia.texto=Se han quitado de la convocatoria del partido contra el {rival} porque tienen la ausencia justificada: {nombres}.

# ---------- 2. Ausencias a partidos (entrenador) ----------
ausencia.justificada.titulo=Ausencia justificada
ausencia.justificada.texto={jugador} no podrá jugar el partido contra el {rival} del {fecha}.
ausencia.convocado.titulo=Ausencia de un convocado
ausencia.convocado.texto={jugador} está en la convocatoria y no podrá jugar el partido contra el {rival} del {fecha}. Edita la convocatoria para poner a otro jugador en su lugar.
ausencia.quitado.titulo=Baja en la convocatoria
ausencia.quitado.texto={jugador} no podrá jugar el partido contra el {rival} del {fecha} y se ha quitado de la convocatoria: no quedan más jugadores disponibles.
ausencia.retirada.titulo=Ausencia retirada
ausencia.retirada.texto={jugador} ya puede jugar el partido contra el {rival} del {fecha}. No se ha añadido a la convocatoria: si cuentas con {jugador}, edítala.

# ---------- 3. Invitados de otros equipos ----------
invitacion.pendiente.titulo=Invitación pendiente de aprobar
invitacion.pendiente.texto={destino} quiere convocar a {jugador} ({origen}) para el partido contra el {rival} del {fecha}.
invitacion.pendiente.push={destino} quiere convocar a un jugador de {origen} el {fecha}. Revísalo en Invitaciones.
invitacion.rechazada.titulo=Invitación rechazada
invitacion.rechazada.texto=Coordinación no ha aprobado que {jugador} juegue con {equipo} el partido contra {rival} del {fecha}. Puedes convocar a otro jugador.
invitacion.liberar.titulo=Libera a un jugador para otro equipo
invitacion.liberar.texto={destino} ha invitado a {jugador} al partido contra {rival} del {fecha}, y ese día {jugador} está en tu convocatoria de {origen}. Si puede jugar con {destino}, quita a {jugador} de tu convocatoria.
invitacion.liberar.push={destino} ha invitado a {jugador} el {fecha}, el mismo día que tu partido. Si puede jugar con ellos, quita a {jugador} de tu convocatoria.
invitacion.plazo.titulo=Invitación sin liberar
invitacion.plazo.texto=Hace más de 12 horas que se pidió a {origen} que libere a {jugador} para jugar con {destino} el {fecha}, y sigue sin respuesta. Puedes hacerlo tú desde Invitaciones.
invitacion.plazo.push=Una invitación lleva más de 12 horas esperando a que liberen a {jugador}.
invitacion.convocado.titulo=Convocatoria con otro equipo
invitacion.convocado.jugador=Te han convocado con {destino} para el partido contra {rival} del {fecha} a las {hora}.\n\nCitación: {horaCitacion} en {lugar}.\n\n
invitacion.convocado.familia=Han convocado a {jugador} con {destino} para el partido contra {rival} del {fecha} a las {hora}.\n\nCitación: {horaCitacion} en {lugar}.\n\n
invitacion.autorizadaOrigen.titulo=Jugador con otro equipo
invitacion.autorizadaOrigen.texto={jugador} jugará con {destino} el partido contra {rival} del {fecha}.
invitacion.informativa.titulo=Jugador con otro equipo el día de tu partido
invitacion.informativa.texto={jugador} jugará con {destino} el partido contra {rival} del {fecha}. Ese día {origen} también juega y {jugador} no estaba en tu convocatoria: ese día ya no podrás convocar a {jugador}.
invitacion.liberadaCoordinacion.titulo=Coordinación ha liberado a un jugador
invitacion.liberadaCoordinacion.texto=Coordinación ha quitado a {jugador} de tu convocatoria para que juegue con {destino} el {fecha}.
invitacion.liberado.titulo=Juega con otro equipo
invitacion.liberado.jugador=Ya no estás en la convocatoria de {origen} para el partido contra {rival} del {fecha}: ese día juegas con {destino}.
invitacion.liberado.familia={jugador} ya no está en la convocatoria de {origen} para el partido contra {rival} del {fecha}: ese día juega con {destino}.
invitacion.anulada.quitado.titulo=Fuera de la convocatoria
invitacion.anulada.borrada.titulo=Convocatoria anulada
invitacion.anulada.cancelado.titulo=Partido cancelado
invitacion.anulada.aplazado.titulo=Partido aplazado
invitacion.anulada.jugador=Ya no juegas con {destino} el partido contra {rival} del {fecha}.
invitacion.anulada.familia={jugador} ya no juega con {destino} el partido contra {rival} del {fecha}.
invitacion.aplazadas.titulo=Partido aplazado: invitaciones anuladas
invitacion.aplazadas.texto=El partido de {destino} contra {rival} pasa del {fechaAntigua} al {fechaNueva}. Se han anulado las invitaciones de {nombres}: si quieres, vuelve a invitarlos para la nueva fecha.
invitacion.aplazadas.push=El partido contra {rival} pasa al {fechaNueva}: se han anulado tus invitaciones a jugadores de otros equipos.
invitacion.enEspera.titulo=Convocatoria con otro equipo en espera
invitacion.enEspera.jugador=Tu convocatoria con {destino} del {fecha} queda en espera: {origen} ha movido un partido a ese día y tu entrenador tiene que darte permiso.
invitacion.enEspera.familia=La convocatoria de {jugador} con {destino} del {fecha} queda en espera: {origen} ha movido un partido a ese día y su entrenador tiene que dar permiso.
invitacion.desestimada.titulo=Un invitado no puede ir
invitacion.desestimada.texto={jugador} no podrá jugar con {equipo} el partido contra {rival} del {fecha}. Puedes convocar a otro jugador en su lugar.

