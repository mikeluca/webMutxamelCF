# Texts of the automatic notifications (inbox, push and emails). English.
# UTF-8. Named placeholders in braces: {jugador}, {rival}... (not MessageFormat: apostrophes are written as is).
# {fecha} = weekday + d/M ("Saturday 25/10"); {fechaCompleta} = d/M/yyyy; {hora} = HH:mm.

# ---------- Common pieces ----------
motivo=Reason: {motivo}
ducha=🚿 A shower after the match is recommended
equipaje.principal=Kit: {equipacion}.
equipaje.mochila=In the bag: {equipacion}.
equipaje.ninguno=No kit specified any more.
lista.y=and
directo.sinGoleadores=No scorers
directo.golSinAutor=Mutxamel CF goal
directo.golPropiaPuerta=Own goal by the opponent

# ---------- 1. Call-ups (player and family) ----------
convocatoria.nueva.titulo=New call-up
convocatoria.nueva.jugador=You've been called up with {equipo} for the match against {rival} on {fecha} at {hora}.\n\nMeet at {horaCitacion} at {lugar}.
convocatoria.nueva.familia={jugador} has been called up with {equipo} for the match against {rival} on {fecha} at {hora}.\n\nMeet at {horaCitacion} at {lugar}.

convocatoria.cambio.titulo=Call-up updated
convocatoria.cambioEquipaje.titulo=Kit change
convocatoria.cambio.jugador=Change to your call-up for the match against {rival}: {cambios}.
convocatoria.cambio.familia=Change to {jugador}'s call-up for the match against {rival}: {cambios}.
cambio.hora=new meeting time, {hora}
cambio.lugar=new meeting place, {lugar}
cambio.partido=the match moves to {fecha} at {hora}
cambio.equipaje=the kit changes

convocatoria.quitado.titulo=Removed from the call-up
convocatoria.quitado.jugador=You're no longer in the call-up for the match against {rival} on {fecha}.
convocatoria.quitado.familia={jugador} is no longer in the call-up for the match against {rival} on {fecha}.

convocatoria.anulada.titulo=Call-up cancelled
convocatoria.anulada.jugador=The call-up for the match against {rival} on {fecha} has been cancelled.
convocatoria.anulada.familia={jugador}'s call-up for the match against {rival} on {fecha} has been cancelled.

convocatoria.quitadosAusencia.titulo=Removed: justified absence
convocatoria.quitadosAusencia.texto=These players have been removed from the call-up for the match against {rival} because their absence is justified: {nombres}.

# ---------- 2. Match absences (coach) ----------
ausencia.justificada.titulo=Justified absence
ausencia.justificada.texto={jugador} won't be able to play the match against {rival} on {fecha}.
ausencia.convocado.titulo=Absence of a called-up player
ausencia.convocado.texto={jugador} is in the call-up and won't be able to play the match against {rival} on {fecha}. Edit the call-up to put another player in their place.
ausencia.quitado.titulo=Dropped from the call-up
ausencia.quitado.texto={jugador} won't be able to play the match against {rival} on {fecha} and has been removed from the call-up: there are no other players available.
ausencia.retirada.titulo=Absence withdrawn
ausencia.retirada.texto={jugador} can now play the match against {rival} on {fecha}. They haven't been added to the call-up: if you're counting on {jugador}, edit it.

# ---------- 3. Players from other teams ----------
invitacion.pendiente.titulo=Invitation awaiting approval
invitacion.pendiente.texto={destino} wants to call up {jugador} ({origen}) for the match against {rival} on {fecha}.
invitacion.pendiente.push={destino} wants to call up a player from {origen} on {fecha}. Review it in Invitations.
invitacion.rechazada.titulo=Invitation rejected
invitacion.rechazada.texto=The coordinators haven't approved {jugador} playing with {equipo} in the match against {rival} on {fecha}. You can call up another player.
invitacion.liberar.titulo=Release a player for another team
invitacion.liberar.texto={destino} has invited {jugador} to the match against {rival} on {fecha}, and that day {jugador} is in your {origen} call-up. If they can play with {destino}, remove {jugador} from your call-up.
invitacion.liberar.push={destino} has invited {jugador} on {fecha}, the same day as your match. If they can play with them, remove {jugador} from your call-up.
invitacion.plazo.titulo=Invitation not released
invitacion.plazo.texto=It's been more than 12 hours since {origen} was asked to release {jugador} to play with {destino} on {fecha}, and there's still no answer. You can do it yourself from Invitations.
invitacion.plazo.push=An invitation has been waiting more than 12 hours for {jugador} to be released.
invitacion.convocado.titulo=Call-up with another team
invitacion.convocado.jugador=You've been called up with {destino} for the match against {rival} on {fecha} at {hora}.\n\nMeet at {horaCitacion} at {lugar}.
invitacion.convocado.familia={jugador} has been called up with {destino} for the match against {rival} on {fecha} at {hora}.\n\nMeet at {horaCitacion} at {lugar}.
invitacion.autorizadaOrigen.titulo=Player with another team
invitacion.autorizadaOrigen.texto={jugador} will play with {destino} in the match against {rival} on {fecha}.
invitacion.informativa.titulo=Player with another team on your match day
invitacion.informativa.texto={jugador} will play with {destino} in the match against {rival} on {fecha}. {origen} also plays that day and {jugador} wasn't in your call-up: you can no longer call up {jugador} that day.
invitacion.liberadaCoordinacion.titulo=The coordinators have released a player
invitacion.liberadaCoordinacion.texto=The coordinators have removed {jugador} from your call-up so they can play with {destino} on {fecha}.
invitacion.liberado.titulo=Playing with another team
invitacion.liberado.jugador=You're no longer in the {origen} call-up for the match against {rival} on {fecha}: that day you're playing with {destino}.
invitacion.liberado.familia={jugador} is no longer in the {origen} call-up for the match against {rival} on {fecha}: that day they're playing with {destino}.
invitacion.anulada.quitado.titulo=Removed from the call-up
invitacion.anulada.borrada.titulo=Call-up cancelled
invitacion.anulada.cancelado.titulo=Match cancelled
invitacion.anulada.aplazado.titulo=Match postponed
invitacion.anulada.jugador=You're no longer playing with {destino} in the match against {rival} on {fecha}.
invitacion.anulada.familia={jugador} is no longer playing with {destino} in the match against {rival} on {fecha}.
invitacion.aplazadas.titulo=Match postponed: invitations cancelled
invitacion.aplazadas.texto={destino}'s match against {rival} moves from {fechaAntigua} to {fechaNueva}. The invitations of {nombres} have been cancelled: if you like, invite them again for the new date.
invitacion.aplazadas.push=The match against {rival} moves to {fechaNueva}: your invitations to players from other teams have been cancelled.
invitacion.enEspera.titulo=Call-up with another team on hold
invitacion.enEspera.jugador=Your call-up with {destino} on {fecha} is on hold: {origen} has moved a match to that day and your coach has to give permission.
invitacion.enEspera.familia={jugador}'s call-up with {destino} on {fecha} is on hold: {origen} has moved a match to that day and their coach has to give permission.
invitacion.desestimada.titulo=An invited player can't come
invitacion.desestimada.texto={jugador} won't be able to play with {equipo} in the match against {rival} on {fecha}. You can call up another player instead.

# ---------- 4. Training ----------
falta.titulo=Missed training
falta.jugador=You didn't come to training on {fecha}. If you can't come one day, let us know in advance in the app: Calendar → the session → Justify absence. Thanks!
falta.familia={jugador} didn't come to training on {fecha}. If they can't come one day, let us know in advance in the app: Calendar → the session → Justify absence. Thanks!
malComportamiento.titulo=Bad behaviour at training
malComportamiento.texto=At the {equipo} training session on {fecha}, {jugador} was marked for bad behaviour.
entrenamientoCancelado.titulo=Training cancelled
entrenamientoCancelado.texto=The {equipo} training session on {fecha} at {hora} has been cancelled.
entrenamientoCancelado.textoSinHora=The {equipo} training session on {fecha} has been cancelled.
faltaJustificada.titulo=Justified absence
faltaJustificada.texto={jugador} ({equipo}) won't come to training on {fecha}.
justificacionRetirada.titulo=Justification withdrawn
justificacionRetirada.texto={jugador} has withdrawn the justification: they will come to training on {fecha}.
pasarLista.titulo=Take attendance
pasarLista.hoy=Have you taken attendance for today's {hora} session? Check {equipo}'s attendance.
pasarLista.otroDia=Have you taken attendance for the session on {fecha} at {hora}? Check {equipo}'s attendance.

# ---------- 5. Matches: reminders and cards ----------
resultadoPendiente.titulo=Result missing
resultadoPendiente.texto=The result of {equipo} - {rival} on {fecha} is missing. Enter it as Mutxamel goals - opponent goals.
recordatorioConvocatoria.titulo=Reminder: call-up pending
recordatorioConvocatoria.texto=The coordinators remind you to publish the call-up for the match against {rival} on {fecha} at {hora}.
recordatorioConvocatoria.textoSinHora=The coordinators remind you to publish the call-up for the match against {rival} on {fecha}.
recordatorioResultado.titulo=Reminder: result pending
recordatorioResultado.texto=The coordinators remind you to enter the result of the match against {rival} on {fecha}.
tarjetas.titulo=Cards
tarjetas.sancion={jugador} has reached {n} yellow cards: possible suspension. Check it on the FFCV.
tarjetas.roja={jugador} was sent off in the match against {rival}: possible suspension. Check it on the FFCV.
tarjetas.aUna={jugador} has {n} yellow cards: one more means a possible suspension.

# ---------- 6. Live match ----------
directo.alineacion.titulo=📋 Mutxamel CF line-up
directo.alineacion.texto=Starting eleven: {once}\n\nSubstitutes: {suplentes}
directo.inicio.titulo=⚽ Kick-off!
directo.inicio.texto=Mutxamel CF - {rival}
directo.gol.titulo=⚽ GOAL for Mutxamel CF!
directo.gol.texto={autor} ({minuto}')\n\n{marcador}
directo.gol.textoSinMinuto={autor}\n\n{marcador}
directo.golContra.titulo=Opponent goal
directo.golContra.texto=Minute {minuto}'\n\n{marcador}
directo.golContra.textoSinMinuto={marcador}
directo.golAnulado.titulo=↩️ Goal disallowed
directo.golAnulado.texto=The last goal has been disallowed. {marcador}
directo.descanso.titulo=⏸️ Half-time
directo.descanso.texto={marcador}
directo.segundaParte.titulo=▶️ Second half under way!
directo.segundaParte.texto=Mutxamel CF - {rival}
directo.final.titulo=🏁 Full time
directo.final.texto={marcador}\n\nScorers: {goleadores}

# ---------- 7. Season, continuity and accounts ----------
continuidad.titulo=Next season: {temporada}
continuidad.recordatorio.titulo=Reminder: next season {temporada}
continuidad.uno=Will {nombres} stay at the club for the {temporada} season? Answer in My players.
continuidad.varios=Will {nombres} stay at the club for the {temporada} season? Answer in My players.
continuidad.recordatorio.uno=You haven't answered yet. Will {nombres} stay at the club for the {temporada} season? Answer in My players.
continuidad.recordatorio.varios=You haven't answered yet. Will {nombres} stay at the club for the {temporada} season? Answer in My players.
continuidad.noSigue.titulo=Leaving: {jugador} ({categoria})
continuidad.noSigue.texto=Their family has answered that they won't continue in {temporada}. Confirm the departure in the season assistant.
continuidad.duda.titulo=Undecided: {jugador} ({categoria})
continuidad.duda.texto=Their family doesn't know yet whether they'll continue in {temporada}. Review it in the season assistant once there's an answer.
temporadaNueva.titulo=New season
temporadaNueva.texto=The {temporada} season starts! Teams will be published in September.
cuentaSinJugadores.titulo=Your account will be deactivated
cuentaSinJugadores.texto=Your account has no active player linked to it. If it stays this way, it will be deactivated on {fechaCompleta}. If this is a mistake, write to the club.

